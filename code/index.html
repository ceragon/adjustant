// ===== COMBAT INIT =====
function startCombat(spawnConfigs, unitList, formAssign){
  showScreen('combat-screen');
  phase='combat';

  // Size canvas to viewport
  const hud=$('combat-hud');
  const availH=window.innerHeight-hud.offsetHeight;
  const availW=window.innerWidth;
  const scale=Math.min(availW/VPW, availH/VPH);
  canvasScale=scale;
  canvas.width=VPW;canvas.height=VPH;
  canvas.style.width=Math.floor(VPW*scale)+'px';
  canvas.style.height=Math.floor(VPH*scale)+'px';
  canvas.style.margin='0 auto';

  units=[];buildings=[];projectiles=[];particles=[];
  battleTimer=BATTLE_TIME;
  advisorTimer=10+Math.random()*5;advisorActive=false;
  selectedTarget=null;selectedUnits=[];moveCursor=null;
  tacticalPriority=null;
  $('advisor-panel').classList.remove('show');

  // Obstacles (may already be init'd from formation preview)
  if(obstacles.length===0) initObstacles();
  if(!terrainCanvas) initTerrain();

  // Place buildings from spawn configs
  const pcfg=spawnConfigs.player, ecfg=spawnConfigs.enemy;
  buildings.push(new Building('hq','player',pcfg.hq[0],pcfg.hq[1]));
  for(const t of pcfg.towers) buildings.push(new Building('tower','player',t[0],t[1]));
  buildings.push(new Building('hq','enemy',ecfg.hq[0],ecfg.hq[1]));
  for(const t of ecfg.towers) buildings.push(new Building('tower','enemy',t[0],t[1]));

  // Place player units by formation
  const playerHQ=buildings.find(b=>b.type==='hq'&&b.team==='player');
  const playerPositions=computeFormationPositions(playerHQ, unitList, formAssign, true);
  unitList.forEach((type,i)=>{
    const pos=playerPositions[i];
    const u=new Unit(type,'player',0,0);
    u.x=pos.x;u.y=pos.y;u.formationRow=formAssign[i];u.idle=true;
    units.push(u);
  });

  // Enemy AI composition + placement
  const enemyComp=aiPickComposition();
  const enemyUnitList=[];
  const enemyFormAssign={};
  const rowMap={infantry:'front',cavalry:'mid',archer:'back'};
  for(const[type,count]of Object.entries(enemyComp)){
    for(let i=0;i<count;i++){enemyUnitList.push(type);}
  }
  enemyUnitList.forEach((type,i)=>{enemyFormAssign[i]=rowMap[type]||'mid';});

  const enemyHQ=buildings.find(b=>b.type==='hq'&&b.team==='enemy');
  const enemyPositions=computeFormationPositions(enemyHQ, enemyUnitList, enemyFormAssign, false);
  enemyUnitList.forEach((type,i)=>{
    const pos=enemyPositions[i];
    const u=new Unit(type,'enemy',0,0);
    u.x=pos.x;u.y=pos.y;u.formationRow=enemyFormAssign[i];u.idle=false;
    units.push(u);
  });

  // Camera: center on player HQ
  cameraX=playerHQ.x-VPW/2;cameraY=playerHQ.y-VPH/2;clampCamera();

  // Fog
  initFog();

  lastTime=performance.now();
  gameLoop(lastTime);
}

function computeFormationPositions(hq, unitList, formAssign, isPlayerLeft){
  const positions={};
  const frontDir=isPlayerLeft?1:-1;
  const rowOffsets={front:3, mid:1.5, back:-2};

  // Group by row
  const rows={front:[],mid:[],back:[]};
  unitList.forEach((_,i)=>rows[formAssign[i]].push(i));

  for(const[row,indices]of Object.entries(rows)){
    const count=indices.length;
    const offsetX=rowOffsets[row]*CELL*frontDir;
    const spacing=CELL*1.2;
    const startY=hq.y-(count-1)*spacing/2;
    indices.forEach((idx,j)=>{
      positions[idx]={x:hq.x+offsetX, y:startY+j*spacing};
    });
  }
  return positions;
}

function aiPickComposition(){
  const comp={infantry:0,archer:0,cavalry:0};
  const types=Object.keys(UNIT_DEFS);
  let maxType='infantry',maxCount=0;
  for(const[t,c]of Object.entries(selected)){if(c>maxCount){maxCount=c;maxType=t;}}
  const counterType=Object.entries(UNIT_DEFS).find(([k,v])=>v.counter===maxType)?.[0]||'infantry';
  comp[counterType]=3+Math.floor(Math.random()*2);
  const remaining=MAX_UNITS-comp[counterType];
  for(let i=0;i<remaining;i++){comp[types[Math.floor(Math.random()*types.length)]]++;}
  return comp;
}

// ===== FOG =====
function generateCloudTexture(){
  const size=256;
  const off=document.createElement('canvas');off.width=size;off.height=size;
  const oCtx=off.getContext('2d');
  const imgData=oCtx.createImageData(size,size);const d=imgData.data;
  const gs1=16,gs2=32;
  const n1=Array.from({length:(gs1+1)*(gs1+1)},()=>Math.random());
  const n2=Array.from({length:(gs2+1)*(gs2+1)},()=>Math.random());
  for(let y=0;y<size;y++){for(let x=0;x<size;x++){
    const gx1=x/size*gs1,gy1=y/size*gs1,ix1=Math.floor(gx1),iy1=Math.floor(gy1);
    const fx1=gx1-ix1,fy1=gy1-iy1,sfx1=fx1*fx1*(3-2*fx1),sfy1=fy1*fy1*(3-2*fy1);
    const s1=gs1+1;
    const v1=n1[iy1*s1+ix1]*(1-sfx1)*(1-sfy1)+n1[iy1*s1+ix1+1]*sfx1*(1-sfy1)+n1[(iy1+1)*s1+ix1]*(1-sfx1)*sfy1+n1[(iy1+1)*s1+ix1+1]*sfx1*sfy1;
    const gx2=x/size*gs2,gy2=y/size*gs2,ix2=Math.floor(gx2),iy2=Math.floor(gy2);
    const fx2=gx2-ix2,fy2=gy2-iy2,sfx2=fx2*fx2*(3-2*fx2),sfy2=fy2*fy2*(3-2*fy2);
    const s2=gs2+1;
    const v2=n2[iy2*s2+ix2]*(1-sfx2)*(1-sfy2)+n2[iy2*s2+ix2+1]*sfx2*(1-sfy2)+n2[(iy2+1)*s2+ix2]*(1-sfx2)*sfy2+n2[(iy2+1)*s2+ix2+1]*sfx2*sfy2;
    const v=v1*0.65+v2*0.35;
    const idx=(y*size+x)*4;
    d[idx]=30+Math.floor(v*40);d[idx+1]=22+Math.floor(v*30);d[idx+2]=10+Math.floor(v*20);d[idx+3]=220+Math.floor(v*35);
  }}
  oCtx.putImageData(imgData,0,0);return off;
}

function initFog(){
  fogGrid=new Uint8Array(COLS*ROWS);
  aiFogGrid=new Uint8Array(COLS*ROWS); // Phase5: AI independent fog
  exploredBuildings=new Map();visionTickTimer=0;
  cloudCanvas=generateCloudTexture();
  fogOverlayCanvas=document.createElement('canvas');fogOverlayCanvas.width=W;fogOverlayCanvas.height=H;
  fogOverlayCtx=fogOverlayCanvas.getContext('2d');
  // Reveal player's own half
  const playerSide=buildings.find(b=>b.team==='player'&&b.type==='hq');
  const isLeft=playerSide && playerSide.gx<COLS/2;
  const halfCol=isLeft?Math.ceil(COLS/2):Math.floor(COLS/2);
  for(let gx=isLeft?0:halfCol;gx<(isLeft?halfCol:COLS);gx++){
    for(let gy=0;gy<ROWS;gy++) fogGrid[gy*COLS+gx]=FOG_VISIBLE;
  }
  // Phase5: Reveal AI's own half (mirrored)
  const aiHalfStart=isLeft?halfCol:0;
  const aiHalfEnd=isLeft?COLS:halfCol;
  for(let gx=aiHalfStart;gx<aiHalfEnd;gx++){
    for(let gy=0;gy<ROWS;gy++) aiFogGrid[gy*COLS+gx]=FOG_VISIBLE;
  }
  // Player vision sources
  for(const b of buildings){if(b.team==='player'&&b.alive) markDiamond(b.gx,b.gy,BUILDING_VISION_RANGE);}
  for(const u of units){if(u.team==='player'&&u.alive) markDiamond(u.gx,u.gy,Math.ceil(u.range+1));}
  // Phase5: AI vision sources — same ranges, but on AI fog
  for(const b of buildings){if(b.team==='enemy'&&b.alive) markDiamondAI(b.gx,b.gy,BUILDING_VISION_RANGE);}
  for(const u of units){if(u.team==='enemy'&&u.alive) markDiamondAI(u.gx,u.gy,Math.ceil(u.range+1));}
}

function markDiamond(cx,cy,range){
  for(let dx=-range;dx<=range;dx++){
    for(let dy=-(range-Math.abs(dx));dy<=(range-Math.abs(dx));dy++){
      const gx=cx+dx,gy=cy+dy;
      if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS) fogGrid[gy*COLS+gx]=FOG_VISIBLE;
    }
  }
}

function updateVision(){
  for(let i=0;i<fogGrid.length;i++){if(fogGrid[i]===FOG_VISIBLE)fogGrid[i]=FOG_EXPLORED;}
  for(const u of units){if(u.alive&&u.team==='player') markDiamond(u.gx,u.gy,Math.ceil(u.range+1));}
  for(const b of buildings){if(b.alive&&b.team==='player') markDiamond(b.gx,b.gy,BUILDING_VISION_RANGE);}
  // REG-003: Keep entire player half always visible every tick
  const playerHQ=buildings.find(b=>b.team==='player'&&b.type==='hq'&&b.alive);
  if(playerHQ){
    const isLeft=playerHQ.gx<COLS/2;
    const halfCol=isLeft?Math.ceil(COLS/2):Math.floor(COLS/2);
    for(let gx=isLeft?0:halfCol;gx<(isLeft?halfCol:COLS);gx++){
      for(let gy=0;gy<ROWS;gy++) fogGrid[gy*COLS+gx]=FOG_VISIBLE;
    }
  }
  // Track explored enemy buildings
  for(const b of buildings){
    if(b.team==='player'||!b.alive)continue;
    if(isCellVisible(b.gx,b.gy)){
      exploredBuildings.set(b.id,{type:b.type,gx:b.gx,gy:b.gy,x:b.x,y:b.y,hp:b.hp,maxHp:b.maxHp,team:b.team,visible:true});
    } else if(exploredBuildings.has(b.id)){exploredBuildings.get(b.id).visible=false;}
  }
}

function getFogCell(gx,gy){if(gx<0||gx>=COLS||gy<0||gy>=ROWS)return FOG_UNEXPLORED;return fogGrid[gy*COLS+gx];}
function isCellVisible(gx,gy){return getFogCell(gx,gy)===FOG_VISIBLE;}
function isCellExplored(gx,gy){const v=getFogCell(gx,gy);return v===FOG_VISIBLE||v===FOG_EXPLORED;}
function isEntityVisibleToPlayer(e){return isCellVisible(Math.floor(e.x/CELL),Math.floor(e.y/CELL));}
function isBuildingVisibleToPlayer(b){return isCellVisible(b.gx,b.gy);}
function isBuildingExplored(b){return exploredBuildings.has(b.id)&&isCellExplored(b.gx,b.gy);}

// ===== GAME LOOP =====
function gameLoop(now){
  const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;
  if(phase!=='combat')return;
  battleTimer-=dt;updateTimer();
  visionTickTimer+=dt;
  if(visionTickTimer>=FOG_TICK_INTERVAL){visionTickTimer-=FOG_TICK_INTERVAL;updateVision();}
  updateCamera(dt);
  updateUnits(dt);updateBuildings(dt);updateProjectiles(dt);updateParticles(dt);
  updateAdvisor(dt);updateMoveCursor(dt);
  checkWinCondition();
  render();
  animId=requestAnimationFrame(gameLoop);
}

function updateTimer(){
  const t=Math.max(0,Math.ceil(battleTimer));
  $('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

// ===== TARGETING =====
function findNearestEnemy(unit){
  let best=null,bestD=Infinity;
  for(const e of units){if(!e.alive||e.team===unit.team)continue;const d=dist(unit,e);if(d<bestD){bestD=d;best=e;}}
  for(const b of buildings){if(!b.alive||b.team===unit.team)continue;if(b.type==='tower'&&!hasLineOfSight(b.x,b.y,unit.x,unit.y))continue;const d=dist(unit,b);if(d<bestD){bestD=d;best=b;}}
  return best;
}

function findNearestVisibleEnemy(unit){
  let best=null,bestD=Infinity;
  for(const e of units){if(!e.alive||e.team===unit.team||!isEntityVisibleToPlayer(e))continue;const d=dist(unit,e);if(d<bestD){bestD=d;best=e;}}
  for(const b of buildings){if(!b.alive||b.team===unit.team||!isBuildingVisibleToPlayer(b))continue;const d=dist(unit,b);if(d<bestD){bestD=d;best=b;}}
  return best;
}

function findPriorityTarget(unit){
  // Manual target override
  if(unit.command && unit.command.type==='focus' && unit.command.target && unit.command.target.alive){
    if(unit.team==='enemy'||isEntityVisibleToPlayer(unit.command.target)) return unit.command.target;
  }
  // Tactical priority
  const enemies=units.filter(u=>u.alive&&u.team!==unit.team);
  if(tacticalPriority && unit.team==='player'){
    const order = tacticalPriority==='back' ? ['back','mid','front'] : ['front','mid','back'];
    for(const row of order){
      const inRow=enemies.filter(e=>isEntityVisibleToPlayer(e)&&e.formationRow===row);
      if(inRow.length>0){
        let best=null,bestD=Infinity;
        for(const e of inRow){const d=dist(unit,e);if(d<bestD){bestD=d;best=e;}}
        return best;
      }
    }
  }
  // Default: nearest visible
  return findNearestVisibleEnemy(unit);
}

// ===== UNIT AI =====
function updateUnits(dt){
  for(const u of units){
    if(!u.alive){u.deathTimer-=dt;continue;}
    u.atkCooldown=Math.max(0,u.atkCooldown-dt);
    u.flashTimer=Math.max(0,u.flashTimer-dt);
    u.swingAnim = Math.max(0, (u.swingAnim||0) - dt*4);

    // Retreating
    // BUG-002: Focus command overrides retreat
    if(u.retreating && u.command && u.command.type==='focus' && u.command.target && u.command.target.alive){
      u.retreating=false;
    }
    if(u.retreating){
      const hq=buildings.find(b=>b.type==='hq'&&b.team===u.team&&b.alive);
      if(hq)moveToward(u,hq.x,hq.y,dt);
      // BUG-001: Passive HP recovery while retreating near HQ
      const healRate=u.maxHp*0.15; // 15% maxHP per second
      u.hp=Math.min(u.maxHp, u.hp + healRate*dt);
      if(u.hp>=u.maxHp)u.retreating=false;
      continue;
    }

    // Enemy auto-retreat
    if(u.team==='enemy'&&u.hp<u.maxHp*0.2){u.retreating=true;u.target=null;continue;}

    // Player units
    if(u.team==='player'){
      if(u.command){
        if(u.command.type==='move'){
          moveToward(u,u.command.x,u.command.y,dt);
          if(moveCursor&&dist(u,{x:u.command.x,y:u.command.y})<CELL*2)moveCursor=null;
          const arrived=dist(u,{x:u.command.x,y:u.command.y})<CELL*1;
          if(arrived){
            u.command=null;u.idle=false;
            // Auto-engage visible enemies in range
            const near=findNearestVisibleEnemy(u);
            if(near&&cellDist(u,near)<=u.range&&u.atkCooldown<=0){
              if(u.range<=2||hasLineOfSight(u.x,u.y,near.x,near.y)){
                u.target=near;attackTarget(u,near);u.atkCooldown=u.atkSpeed;
              }
            }
          }
        } else if(u.command.type==='focus'&&u.command.target&&u.command.target.alive){
          const t=u.command.target;
          const visible=t.team==='player'||isEntityVisibleToPlayer(t);
          if(!visible){u.command=null;u.target=null;u.idle=true;continue;}
          u.target=t;
          const d=cellDist(u,t);
          if(d<=u.range){
            moveToAttackSlot(u,t,dt);
            if(u.atkCooldown<=0){
              if(u.range>2&&!hasLineOfSight(u.x,u.y,t.x,t.y)){moveToward(u,t.x,t.y,dt);}
              else{attackTarget(u,t);u.atkCooldown=u.atkSpeed;u.swingAnim=1;}
            }
          } else {moveToward(u,t.x,t.y,dt);}
        } else {u.command=null;u.idle=true;}
      } else if(!u.idle && u.target && u.target.alive){
        // Continuing combat from auto-engage
        const visible=u.target.team==='player'||isEntityVisibleToPlayer(u.target);
        if(!visible){u.target=null;u.idle=true;continue;}
        u.facing = Math.atan2(u.target.y-u.y, u.target.x-u.x);
        const d=cellDist(u,u.target);
        if(d<=u.range){
          moveToAttackSlot(u,u.target,dt);
          if(u.atkCooldown<=0){
            if(u.range>2&&!hasLineOfSight(u.x,u.y,u.target.x,u.target.y)){moveToward(u,u.target.x,u.target.y,dt);}
            else{attackTarget(u,u.target);u.atkCooldown=u.atkSpeed;u.swingAnim=1;}
          }
        } else {moveToward(u,u.target.x,u.target.y,dt);}
      } else if(!u.idle && (!u.target||!u.target.alive)){
        // BUG-005: Target lost → idle, don't auto-switch
        u.idle=true;u.target=null;
      }
      // idle: do nothing
      continue;
    }

    // Enemy AI (god view)
    if(!u.target||!u.target.alive) u.target=findNearestEnemy(u);
    if(u.target){
      u.facing = Math.atan2(u.target.y-u.y, u.target.x-u.x);
      const d=cellDist(u,u.target);
      if(d<=u.range){
        moveToAttackSlot(u,u.target,dt);
        if(u.atkCooldown<=0){
          if(u.range>2&&!hasLineOfSight(u.x,u.y,u.target.x,u.target.y)){moveToward(u,u.target.x,u.target.y,dt);}
          else{attackTarget(u,u.target);u.atkCooldown=u.atkSpeed;u.swingAnim=1;}
        }
      } else {moveToward(u,u.target.x,u.target.y,dt);}
    }
  }

  // Remove dead
  units=units.filter(u=>u.alive||u.deathTimer>0);

  // Separation — Phase5.2: cap iterations to prevent main-thread freeze
  const MAX_SEP_ITER = 200;
  let sepCount = 0;
  for(let i=0;i<units.length;i++){
    if(!units[i].alive)continue;
    for(let j=i+1;j<units.length;j++){
      if(!units[j].alive)continue;
      if(++sepCount > MAX_SEP_ITER) break;
      const a=units[i],b=units[j];const d=dist(a,b);const minD=CELL*0.6;
      if(d<minD&&d>0){const push=(minD-d)*0.3;const dx=(a.x-b.x)/d,dy=(a.y-b.y)/d;
        a.x+=dx*push;a.y+=dy*push;b.x-=dx*push;b.y-=dy*push;}
    }
    if(sepCount > MAX_SEP_ITER) break;
  }
}

function moveToAttackSlot(u,target,dt){
  const attackers=units.filter(o=>o.alive&&o.team===u.team&&o.target===target);
  const count=attackers.length;if(count<=1)return;
  const idx=attackers.indexOf(u);
  const angle=(Math.PI*2/count)*idx;
  const r=u.range*CELL*0.85;
  const sx=target.x+Math.cos(angle)*r, sy=target.y+Math.sin(angle)*r;
  if(Math.hypot(u.x-sx,u.y-sy)>CELL*0.3) moveToward(u,sx,sy,dt);
}

function moveToward(u,tx,ty,dt){
  const dx=tx-u.x,dy=ty-u.y;const d=Math.hypot(dx,dy);if(d<2)return;
  // Stuck detection: record position before movement
  const prevX=u.x,prevY=u.y;
  if(u._stuckFrames===undefined){u._stuckFrames=0;u._stuckEscape=0;}
  // If currently in escape mode, move backward for a few frames before resuming
  if(u._stuckEscape>0){
    u._stuckEscape--;
    const backDir=Math.atan2(u.y-ty,u.x-tx); // away from target
    const bx=Math.cos(backDir)*u.speed*CELL*dt*1.5;
    const by=Math.sin(backDir)*u.speed*CELL*dt*1.5;
    const nbx=u.x+bx,nby=u.y+by;
    if(!isObstacleAt(nbx,nby)){u.x=nbx;u.y=nby;}
    else{
      // Try perpendicular escape
      const px=-Math.sin(backDir),py=Math.cos(backDir);
      const ex=u.x+px*u.speed*CELL*dt,ey=u.y+py*u.speed*CELL*dt;
      if(!isObstacleAt(ex,ey)){u.x=ex;u.y=ey;}
    }
    u.x=clamp(u.x,CELL/2,W-CELL/2);u.y=clamp(u.y,CELL/2,H-CELL/2);
    return;
  }
  let dirX=dx/d,dirY=dy/d;const step=u.speed*CELL*dt;
  u.facing = Math.atan2(dirY, dirX);
  const la=CELL*0.8;const nx=u.x+dirX*la,ny=u.y+dirY*la;
  if(isObstacleAt(nx,ny)){
    const px=-dirY,py=dirX;
    const a1x=u.x+(dirX*0.5+px)*la,a1y=u.y+(dirY*0.5+py)*la;
    const a2x=u.x+(dirX*0.5-px)*la,a2y=u.y+(dirY*0.5-py)*la;
    const b1=isObstacleAt(a1x,a1y),b2=isObstacleAt(a2x,a2y);
    if(!b1&&(b2||Math.random()>0.5)){dirX=dirX*0.5+px;dirY=dirY*0.5+py;}
    else if(!b2){dirX=dirX*0.5-px;dirY=dirY*0.5-py;}
    else {
      // NEW-001: Both lateral probes blocked — try full perpendicular directions (90° turn)
      const p1x=u.x+px*la,p1y=u.y+py*la;
      const p2x=u.x-px*la,p2y=u.y-py*la;
      if(!isObstacleAt(p1x,p1y)){dirX=px;dirY=py;}
      else if(!isObstacleAt(p2x,p2y)){dirX=-px;dirY=-py;}
      else {
        // NEW-002: All directions blocked — try backing up slightly then re-probing
        const backX=u.x-dirX*CELL*0.5,backY=u.y-dirY*CELL*0.5;
        if(!isObstacleAt(backX,backY)){
          // Move backward to create space, then try perpendicular again
          u.x=backX;u.y=backY;
          const bp1x=backX+px*la*1.5,bp1y=backY+py*la*1.5;
          const bp2x=backX-px*la*1.5,bp2y=backY-py*la*1.5;
          if(!isObstacleAt(bp1x,bp1y)){dirX=px;dirY=py;}
          else if(!isObstacleAt(bp2x,bp2y)){dirX=-px;dirY=-py;}
          else {dirX=px;dirY=py;} // Force perpendicular as last resort
        } else {
          // Truly trapped — force perpendicular movement anyway (may squeeze through gaps)
          dirX=px;dirY=py;
        }
      }
    }
    const nd=Math.hypot(dirX,dirY);if(nd>0){dirX/=nd;dirY/=nd;}
  }
  const newX=u.x+dirX*Math.min(step,d),newY=u.y+dirY*Math.min(step,d);
  if(!isObstacleAt(newX,newY)){u.x=newX;u.y=newY;}
  else{
    // NEW-003: If diagonal move blocked, try axis-aligned with obstacle avoidance
    const stepX=dirX*Math.min(step,d),stepY=dirY*Math.min(step,d);
    if(!isObstacleAt(u.x+stepX,u.y)){u.x+=stepX;}
    else if(!isObstacleAt(u.x,u.y+stepY)){u.y+=stepY;}
    else {
      // NEW-004: Both axes blocked — try perpendicular sliding
      const px=-dirY,py=dirX;
      const perpStep=u.speed*CELL*dt*0.7;
      if(!isObstacleAt(u.x+px*perpStep,u.y+py*perpStep)){
        u.x+=px*perpStep;u.y+=py*perpStep;
      } else if(!isObstacleAt(u.x-px*perpStep,u.y-py*perpStep)){
        u.x-=px*perpStep;u.y-=py*perpStep;
      }
      // else: truly stuck, unit will wait for separation or obstacle clearance
    }
  }
  u.x=clamp(u.x,CELL/2,W-CELL/2);u.y=clamp(u.y,CELL/2,H-CELL/2);
  // Stuck detection: check displacement this frame
  const moved=Math.hypot(u.x-prevX,u.y-prevY);
  if(moved<0.08){
    u._stuckFrames++;
    if(u._stuckFrames>=30){
      // Unit is stuck — clear command, enter escape mode for 15 frames
      u._stuckFrames=0;
      u._stuckEscape=15;
      u.command=null;
      u.idle=true;
    }
  } else {
    u._stuckFrames=0;
  }
}

function attackTarget(attacker,target){
  let dmg=attacker.atk;
  if(target.type&&attacker.counter===target.type)dmg=Math.floor(dmg*COUNTER_BONUS);
  if(attacker.range>2){projectiles.push({x:attacker.x,y:attacker.y,tx:target.x,ty:target.y,target,dmg,speed:300,team:attacker.team});}
  else{applyDamage(target,dmg);}
}

function applyDamage(target,dmg){
  target.hp-=dmg;target.flashTimer=0.15;
  const oy=target.type==='hq'?-CELL*1.2:target.type==='tower'?-CELL*0.9:-CELL*0.7;
  spawnDmgNumber(target.x+(Math.random()-0.5)*CELL*0.4,target.y+oy,dmg,target.team==='player'?'#ff7055':'#f4cf5b');
  // Blood sparks
  for(let i=0;i<4;i++){
    particles.push({
      x:target.x, y:target.y-CELL*0.2,
      vx:(Math.random()-.5)*100, vy:(Math.random()-.7)*80,
      life:0.5, color:'#8a1a10', size:2+Math.random()*2,
      gravity:260
    });
  }
  if(target.hp<=0){
    target.hp=0;target.alive=false;if(target.deathTimer!==undefined)target.deathTimer=0.7;
    for(let i=0;i<12;i++){
      particles.push({
        x:target.x, y:target.y,
        vx:(Math.random()-.5)*160, vy:(Math.random()-.5)*160,
        life:0.9, color:Math.random()>0.5?'#f4cf5b':'#b8301f', size:3+Math.random()*3,
        gravity:80
      });
    }
    if(selectedTarget&&selectedTarget.entity===target)selectedTarget=null;
    selectedUnits=selectedUnits.filter(u=>u!==target);
    if(target.id)exploredBuildings.delete(target.id);
  }
  updateHQBars();
}

function updateHQBars(){
  const ph=buildings.find(b=>b.type==='hq'&&b.team==='player');
  const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy');
  if(ph)$('player-hq-hp').style.width=(ph.hp/ph.maxHp*100)+'%';
  if(eh&&isBuildingVisibleToPlayer(eh))$('enemy-hq-hp').style.width=(eh.hp/eh.maxHp*100)+'%';
}

function spawnDmgNumber(wx,wy,dmg,color){
  const rect=canvas.getBoundingClientRect();
  const sx=rect.left+(wx-cameraX)*canvasScale;
  const sy=rect.top+(wy-cameraY)*canvasScale;
  const el=document.createElement('div');el.className='dmg-num';
  el.style.left=sx+'px';el.style.top=sy+'px';el.style.color=color;el.textContent='-'+dmg;
  $('combat-screen').appendChild(el);setTimeout(()=>el.remove(),800);
}

// ===== BUILDINGS =====
function updateBuildings(dt){
  for(const b of buildings){
    if(!b.alive)continue;b.flashTimer=Math.max(0,b.flashTimer-dt);
    if(b.atk<=0)continue;b.atkCooldown=Math.max(0,b.atkCooldown-dt);if(b.atkCooldown>0)continue;
    const enemies=units.filter(u=>u.alive&&u.team!==b.team);
    let best=null,bestD=Infinity;
    for(const e of enemies){
      if(b.team==='player'&&!isEntityVisibleToPlayer(e))continue;
      const d=cellDist(b,e);
      if(d<bestD&&d<=b.range&&hasLineOfSight(b.x,b.y,e.x,e.y)){bestD=d;best=e;}
    }
    if(best){projectiles.push({x:b.x,y:b.y,tx:best.x,ty:best.y,target:best,dmg:b.atk,speed:250,team:b.team});b.atkCooldown=b.atkSpeed;}
  }
}

function updateProjectiles(dt){
  for(const p of projectiles){
    if(p.arcV === undefined){ p.arcV = -180 - Math.random()*60; p.arc = 0; }
    p.arc = (p.arc||0) + p.arcV * dt;
    p.arcV += 420 * dt; // gravity
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),step=p.speed*dt;
    if(d<step+5){if(p.target&&p.target.alive)applyDamage(p.target,p.dmg);p.done=true;}
    else{p.x+=(dx/d)*step;p.y+=(dy/d)*step;if(p.target&&p.target.alive){p.tx=p.target.x;p.ty=p.target.y;}}
  }
  projectiles=projectiles.filter(p=>!p.done);
}

function updateParticles(dt){
  for(const p of particles){
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.gravity) p.vy += p.gravity*dt;
    p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
}

function updateMoveCursor(dt){if(moveCursor){moveCursor.timer-=dt;if(moveCursor.timer<=0)moveCursor=null;}}

// ===== ADVISOR =====
const ADVICE=[
  {cond:()=>units.filter(u=>u.alive&&u.team==='enemy'&&u.type==='cavalry').length>=2,msg:'敌方骑兵压力较大，建议集中步兵拦截！',action:'focusCavalry'},
  {cond:()=>units.filter(u=>u.alive&&u.team==='enemy'&&u.type==='archer').length>=2,msg:'敌方射手火力密集，建议派骑兵突袭！',action:'focusArcher'},
  {cond:()=>units.filter(u=>u.alive&&u.team==='player'&&u.hp<u.maxHp*0.3).length>=2,msg:'多个单位血量告急，建议撤退重组！',action:'retreatLow'},
  {cond:()=>{const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy');return eh&&eh.hp<eh.maxHp*0.5;},msg:'敌方主堡受损严重，全力进攻！',action:'pushHQ'},
  {cond:()=>true,msg:'战场局势胶着，注意兵种克制关系。',action:null},
];

function updateAdvisor(dt){
  if(advisorActive)return;advisorTimer-=dt;
  if(advisorTimer<=0){advisorTimer=15+Math.random()*10;const a=ADVICE.find(a=>a.cond())||ADVICE[ADVICE.length-1];showAdvisor(a.msg,a.action);}
}
function showAdvisor(msg,action){advisorActive=true;advisorAction=action;$('advisor-msg').textContent=msg;$('advisor-panel').classList.add('show');}
function acceptAdvice(){
  const targets = selectedUnits.length>0 ? selectedUnits : units.filter(u=>u.alive&&u.team==='player');
  if(advisorAction==='focusCavalry'){const ec=units.find(u=>u.alive&&u.team==='enemy'&&u.type==='cavalry');if(ec){targets.forEach(u=>{u.command={type:'focus',target:ec};u.idle=false;});selectedTarget={entity:ec,glowColor:'#ef4444'};}}
  else if(advisorAction==='focusArcher'){const ea=units.find(u=>u.alive&&u.team==='enemy'&&u.type==='archer');if(ea){targets.forEach(u=>{u.command={type:'focus',target:ea};u.idle=false;});selectedTarget={entity:ea,glowColor:'#ef4444'};}}
  else if(advisorAction==='retreatLow'){units.filter(u=>u.alive&&u.team==='player'&&u.hp<u.maxHp*0.3).forEach(u=>u.retreating=true);}
  else if(advisorAction==='pushHQ'){const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy'&&b.alive);if(eh){targets.forEach(u=>{u.command={type:'move',x:eh.x,y:eh.y};u.idle=false;});moveCursor={x:eh.x,y:eh.y,timer:3};}}
  dismissAdvisor();
}
function dismissAdvisor(){advisorActive=false;$('advisor-panel').classList.remove('show');}

// ===== WIN =====
function checkWinCondition(){
  const ph=buildings.find(b=>b.type==='hq'&&b.team==='player');
  const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy');
  if(eh&&!eh.alive){endGame('win');return;}
  if(ph&&!ph.alive){endGame('lose');return;}
  if(battleTimer<=0){const pp=calcPower('player'),ep=calcPower('enemy');if(pp>ep)endGame('win');else if(ep>pp)endGame('lose');else endGame('draw');}
}
function calcPower(team){
  let p=0;const hq=buildings.find(b=>b.type==='hq'&&b.team===team);
  if(hq&&hq.alive)p+=hq.hp;
  units.filter(u=>u.alive&&u.team===team).forEach(u=>p+=u.hp);
  buildings.filter(b=>b.alive&&b.team===team&&b.type==='tower').forEach(b=>p+=b.hp);
  return p;
}
function endGame(result){
  phase='result';if(animId)cancelAnimationFrame(animId);
  const t=$('result-title');
  if(result==='win'){t.textContent='胜 利';t.className='win';}
  else if(result==='lose'){t.textContent='战 败';t.className='lose';}
  else{t.textContent='平 局';t.className='draw';}
  const pA=units.filter(u=>u.team==='player'&&u.alive).length;
  const eL=MAX_UNITS-units.filter(u=>u.team==='enemy'&&u.alive).length;
  const timeUsed=BATTLE_TIME-Math.max(0,Math.ceil(battleTimer));
  $('result-stats').innerHTML=`<div>⏱ 用时: ${Math.floor(timeUsed/60)}分${timeUsed%60}秒</div><div>🔵 我方损失: ${MAX_UNITS-pA}</div><div>🔴 敌方损失: ${eL}</div><div>🔵 我方剩余: ${calcPower('player')}</div><div>🔴 敌方剩余: ${calcPower('enemy')}</div>`;
  showScreen('result-screen');
}

// ===== RENDERING =====
function render(){
  ctx.clearRect(0,0,VPW,VPH);
  ctx.save();
  ctx.translate(-cameraX,-cameraY);

  drawGrid();drawDecorations();drawObstacles();
  drawBuildingShadows();
  drawPlayerBuildings();drawPlayerUnits();
  drawVisibleEnemyBuildings();drawVisibleEnemyUnits();
  drawProjectiles();drawParticles();
  drawFogOverlay();
  drawSelectionGlow();drawMoveCursor();drawDeathSkulls();
  drawSelectionRect();

  ctx.restore();
  drawMinimap();
}

function drawGrid(){
  if(terrainCanvas){
    ctx.drawImage(terrainCanvas, 0, 0);
  } else {
    ctx.fillStyle='#2f5420';
    ctx.fillRect(0,0,W,H);
  }
}


function drawDecorations(){
  for(const d of decorationList){
    const cx = d.gx*CELL + CELL/2;
    const cy = d.gy*CELL + CELL/2;
    let nearUnit = false;
    for(const u of units){
      if(u.alive && Math.hypot(u.x-cx, u.y-cy) < CELL*1.2){nearUnit=true;break;}
    }
    if(nearUnit) continue;
    if(d.type==='tree'){
      ctx.fillStyle='rgba(0,0,0,0.25)';
      ctx.beginPath();ctx.ellipse(cx+2, cy+CELL*0.3, CELL*0.35, CELL*0.13, 0, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle='#3a2410';
      ctx.fillRect(cx-2, cy-2, 4, CELL*0.3);
      const r1 = CELL*0.32, r2 = CELL*0.25;
      ctx.fillStyle='#1e3812';
      ctx.beginPath();ctx.arc(cx-3, cy-4, r1, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle='#2a4a18';
      ctx.beginPath();ctx.arc(cx+3, cy-2, r1, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle='#3a6624';
      ctx.beginPath();ctx.arc(cx, cy-7, r2, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle='#4a7a32';
      ctx.beginPath();ctx.arc(cx-2, cy-9, CELL*0.15, 0, Math.PI*2);ctx.fill();
    } else if(d.type==='bush'){
      ctx.fillStyle='#2a4a18';
      ctx.beginPath();ctx.arc(cx, cy, CELL*0.18, 0, Math.PI*2);ctx.fill();
      ctx.fillStyle='#3a6624';
      ctx.beginPath();ctx.arc(cx-2, cy-1, CELL*0.12, 0, Math.PI*2);ctx.fill();
    }
  }
}

function drawObstacles(){
  for(const obs of obstacles){
    const x=obs.gx*CELL, y=obs.gy*CELL;
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(x+CELL/2+2, y+CELL*0.85, CELL*0.42, CELL*0.13, 0, 0, Math.PI*2);
    ctx.fill();
    // Base rock
    ctx.fillStyle='#3d3832';
    ctx.beginPath();
    ctx.moveTo(x+CELL*0.15, y+CELL*0.85);
    ctx.lineTo(x+CELL*0.1, y+CELL*0.45);
    ctx.lineTo(x+CELL*0.25, y+CELL*0.2);
    ctx.lineTo(x+CELL*0.55, y+CELL*0.12);
    ctx.lineTo(x+CELL*0.82, y+CELL*0.25);
    ctx.lineTo(x+CELL*0.9, y+CELL*0.55);
    ctx.lineTo(x+CELL*0.78, y+CELL*0.85);
    ctx.closePath();
    ctx.fill();
    // Top highlight
    ctx.fillStyle='#5a5248';
    ctx.beginPath();
    ctx.moveTo(x+CELL*0.2, y+CELL*0.4);
    ctx.lineTo(x+CELL*0.3, y+CELL*0.22);
    ctx.lineTo(x+CELL*0.55, y+CELL*0.18);
    ctx.lineTo(x+CELL*0.75, y+CELL*0.3);
    ctx.lineTo(x+CELL*0.6, y+CELL*0.45);
    ctx.lineTo(x+CELL*0.35, y+CELL*0.48);
    ctx.closePath();
    ctx.fill();
    // Specular
    ctx.fillStyle='rgba(244,207,91,0.12)';
    ctx.beginPath();
    ctx.ellipse(x+CELL*0.38, y+CELL*0.28, CELL*0.12, CELL*0.06, -0.4, 0, Math.PI*2);
    ctx.fill();
    // Cracks
    ctx.strokeStyle='rgba(0,0,0,0.4)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x+CELL*0.4, y+CELL*0.4);
    ctx.lineTo(x+CELL*0.55, y+CELL*0.55);
    ctx.lineTo(x+CELL*0.5, y+CELL*0.7);
    ctx.stroke();
    // Moss
    ctx.fillStyle='#3a6624';
    ctx.beginPath();ctx.arc(x+CELL*0.25, y+CELL*0.78, CELL*0.08, 0, Math.PI*2);ctx.fill();
    ctx.fillStyle='#4a7a32';
    ctx.beginPath();ctx.arc(x+CELL*0.72, y+CELL*0.82, CELL*0.06, 0, Math.PI*2);ctx.fill();
  }
}

function drawPlayerBuildings(){for(const b of buildings){if(!b.alive||b.team!=='player')continue;drawBuilding(b,false);}}
function drawVisibleEnemyBuildings(){for(const b of buildings){if(!b.alive||b.team==='player'||!isBuildingVisibleToPlayer(b))continue;drawBuilding(b,false);}}

function drawBuilding(b,asShadow){
  const isPlayer=b.team==='player';
  const mainColor=isPlayer?'#2a6fc7':'#b8301f';
  const trimColor=isPlayer?'#5a9df0':'#e4553f';
  const stoneColor='#6a6258';
  const goldTrim=isPlayer?'#f4cf5b':'#d4a63a';

  if(asShadow){
    ctx.save();ctx.globalAlpha=0.35;
    if(b.type==='hq'){
      ctx.fillStyle='#2a2018';
      ctx.fillRect(b.x-CELL*1.05, b.y-CELL*1.05, CELL*2.1, CELL*2.1);
      ctx.font='bold 11px Cinzel, serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#888';ctx.fillText('KEEP', b.x, b.y);
    } else {
      ctx.fillStyle='#2a2018';
      ctx.beginPath();ctx.arc(b.x,b.y,CELL*0.55,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();return;
  }

  // Flash on damage
  if(b.flashTimer>0){
    ctx.save();
    ctx.fillStyle='rgba(255,220,180,0.55)';
    if(b.type==='hq') ctx.fillRect(b.x-CELL*1.1, b.y-CELL*1.1, CELL*2.2, CELL*2.2);
    else {ctx.beginPath();ctx.arc(b.x,b.y,CELL*0.7,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  }

  if(b.type==='hq'){
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath();ctx.ellipse(b.x+3, b.y+CELL*1.0, CELL*1.2, CELL*0.25, 0, 0, Math.PI*2);ctx.fill();

    // Stone base platform
    ctx.fillStyle=stoneColor;
    ctx.fillRect(b.x-CELL*1.05, b.y-CELL*0.3, CELL*2.1, CELL*1.35);

    // Main keep body
    const grad = ctx.createLinearGradient(b.x-CELL, 0, b.x+CELL, 0);
    grad.addColorStop(0, shadeColor(stoneColor, -15));
    grad.addColorStop(0.5, stoneColor);
    grad.addColorStop(1, shadeColor(stoneColor, -25));
    ctx.fillStyle=grad;
    ctx.fillRect(b.x-CELL*0.9, b.y-CELL*0.85, CELL*1.8, CELL*1.5);

    // Crenellations
    ctx.fillStyle=stoneColor;
    for(let i=0;i<5;i++){
      ctx.fillRect(b.x-CELL*0.9+i*CELL*0.4, b.y-CELL*1.05, CELL*0.25, CELL*0.2);
    }

    // Central tower
    ctx.fillStyle=shadeColor(stoneColor,-10);
    ctx.fillRect(b.x-CELL*0.3, b.y-CELL*1.25, CELL*0.6, CELL*0.6);
    // Pointed roof
    ctx.fillStyle=mainColor;
    ctx.beginPath();
    ctx.moveTo(b.x-CELL*0.35, b.y-CELL*1.25);
    ctx.lineTo(b.x, b.y-CELL*1.65);
    ctx.lineTo(b.x+CELL*0.35, b.y-CELL*1.25);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=goldTrim;ctx.lineWidth=1.2;ctx.stroke();

    // Flag pole
    ctx.strokeStyle='#3a2410';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(b.x, b.y-CELL*1.65);ctx.lineTo(b.x, b.y-CELL*1.95);ctx.stroke();
    // Flag
    ctx.fillStyle=mainColor;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y-CELL*1.95);
    ctx.lineTo(b.x+CELL*0.22, b.y-CELL*1.85);
    ctx.lineTo(b.x, b.y-CELL*1.75);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=goldTrim;ctx.lineWidth=0.8;ctx.stroke();

    // Gate arch
    ctx.fillStyle='#1a0f05';
    ctx.beginPath();
    ctx.arc(b.x, b.y+CELL*0.15, CELL*0.22, Math.PI, 0);
    ctx.lineTo(b.x+CELL*0.22, b.y+CELL*0.6);
    ctx.lineTo(b.x-CELL*0.22, b.y+CELL*0.6);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=goldTrim;ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y+CELL*0.15, CELL*0.22, Math.PI, 0);
    ctx.lineTo(b.x+CELL*0.22, b.y+CELL*0.6);
    ctx.moveTo(b.x-CELL*0.22, b.y+CELL*0.15);
    ctx.lineTo(b.x-CELL*0.22, b.y+CELL*0.6);
    ctx.stroke();

    // Lit windows
    ctx.fillStyle='#f4cf5b';ctx.globalAlpha=0.75;
    ctx.fillRect(b.x-CELL*0.65, b.y-CELL*0.4, CELL*0.12, CELL*0.2);
    ctx.fillRect(b.x+CELL*0.55, b.y-CELL*0.4, CELL*0.12, CELL*0.2);
    ctx.globalAlpha=1;
    ctx.strokeStyle='#3a2410';ctx.lineWidth=0.8;
    ctx.strokeRect(b.x-CELL*0.65, b.y-CELL*0.4, CELL*0.12, CELL*0.2);
    ctx.strokeRect(b.x+CELL*0.55, b.y-CELL*0.4, CELL*0.12, CELL*0.2);

    // Team banner on wall
    ctx.fillStyle=mainColor;
    ctx.fillRect(b.x-CELL*0.12, b.y-CELL*0.6, CELL*0.24, CELL*0.35);
    ctx.strokeStyle=goldTrim;ctx.lineWidth=1;
    ctx.strokeRect(b.x-CELL*0.12, b.y-CELL*0.6, CELL*0.24, CELL*0.35);
    ctx.fillStyle=goldTrim;
    ctx.font='bold 14px Cinzel, serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(isPlayer?'⚜':'☠', b.x, b.y-CELL*0.42);

    drawHPBar(b.x-CELL, b.y+CELL*1.1, CELL*2, 6, b.hp, b.maxHp, mainColor);

  } else {
    // Tower
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath();ctx.ellipse(b.x+2, b.y+CELL*0.55, CELL*0.55, CELL*0.15, 0, 0, Math.PI*2);ctx.fill();
    // Stone base
    ctx.fillStyle=stoneColor;
    ctx.beginPath();ctx.arc(b.x, b.y+CELL*0.2, CELL*0.5, 0, Math.PI*2);ctx.fill();
    // Body
    const tGrad = ctx.createLinearGradient(b.x-CELL*0.4, 0, b.x+CELL*0.4, 0);
    tGrad.addColorStop(0, shadeColor(stoneColor, -20));
    tGrad.addColorStop(0.5, stoneColor);
    tGrad.addColorStop(1, shadeColor(stoneColor, -30));
    ctx.fillStyle=tGrad;
    ctx.fillRect(b.x-CELL*0.38, b.y-CELL*0.4, CELL*0.76, CELL*0.75);
    // Crenellations
    ctx.fillStyle=stoneColor;
    for(let i=0;i<4;i++){
      ctx.fillRect(b.x-CELL*0.38+i*CELL*0.22, b.y-CELL*0.52, CELL*0.13, CELL*0.13);
    }
    // Pointed roof
    ctx.fillStyle=mainColor;
    ctx.beginPath();
    ctx.moveTo(b.x-CELL*0.45, b.y-CELL*0.52);
    ctx.lineTo(b.x, b.y-CELL*1.1);
    ctx.lineTo(b.x+CELL*0.45, b.y-CELL*0.52);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=goldTrim;ctx.lineWidth=1;ctx.stroke();
    // Flag
    ctx.strokeStyle='#3a2410';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(b.x, b.y-CELL*1.1);ctx.lineTo(b.x, b.y-CELL*1.3);ctx.stroke();
    ctx.fillStyle=trimColor;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y-CELL*1.3);
    ctx.lineTo(b.x+CELL*0.15, b.y-CELL*1.22);
    ctx.lineTo(b.x, b.y-CELL*1.15);
    ctx.closePath();ctx.fill();
    // Arrow slit
    ctx.fillStyle='#1a0f05';
    ctx.fillRect(b.x-CELL*0.04, b.y-CELL*0.15, CELL*0.08, CELL*0.2);
    // Range ring
    ctx.strokeStyle=trimColor;ctx.lineWidth=0.6;ctx.globalAlpha=0.2;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.arc(b.x,b.y,b.range*CELL,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;

    drawHPBar(b.x-CELL*0.6, b.y+CELL*0.7, CELL*1.2, 4, b.hp, b.maxHp, mainColor);
  }
}

function drawPlayerUnits(){for(const u of units){if(!u.alive||u.team!=='player')continue;drawUnit(u);}}
function drawVisibleEnemyUnits(){for(const u of units){if(!u.alive||u.team==='player'||!isEntityVisibleToPlayer(u))continue;drawUnit(u);}}

function drawUnit(u){
  const def=UNIT_DEFS[u.type];
  const isPlayer=u.team==='player';
  const teamMain = isPlayer ? '#2a6fc7' : '#b8301f';
  const teamBright = isPlayer ? '#5a9df0' : '#e4553f';
  const teamGold = isPlayer ? '#f4cf5b' : '#d4a63a';
  const skinTone = '#d4a878';
  const clothAlly = '#3a7ad0';
  const clothFoe = '#c4381f';

  // Retreat indicator
  if(u.retreating){
    ctx.save();
    ctx.strokeStyle='#66dd44';ctx.lineWidth=1.5;ctx.globalAlpha=0.65;
    ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.6,0,Math.PI*2);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#66dd44';
    ctx.beginPath();
    ctx.moveTo(u.x, u.y-CELL*0.95);
    ctx.lineTo(u.x-CELL*0.12, u.y-CELL*0.75);
    ctx.lineTo(u.x+CELL*0.12, u.y-CELL*0.75);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Flash on damage
  if(u.flashTimer>0){
    ctx.save();
    ctx.fillStyle='rgba(255,240,200,0.7)';
    ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.5,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.4)';
  ctx.beginPath();ctx.ellipse(u.x, u.y+CELL*0.32, CELL*0.32, CELL*0.1, 0, 0, Math.PI*2);ctx.fill();

  // Team-colored ring
  ctx.strokeStyle=teamMain;ctx.lineWidth=2;
  ctx.beginPath();ctx.ellipse(u.x, u.y+CELL*0.32, CELL*0.38, CELL*0.13, 0, 0, Math.PI*2);ctx.stroke();
  ctx.strokeStyle=teamBright;ctx.lineWidth=0.8;
  ctx.beginPath();ctx.ellipse(u.x, u.y+CELL*0.32, CELL*0.42, CELL*0.15, 0, 0, Math.PI*2);ctx.stroke();

  // Flip horizontally based on facing
  ctx.save();
  ctx.translate(u.x, u.y);
  const faceFlip = Math.cos(u.facing||0) < 0 ? -1 : 1;
  ctx.scale(faceFlip, 1);

  const swing = u.swingAnim || 0;

  if(u.type === 'infantry'){
    // Legs
    ctx.fillStyle='#3a2410';
    ctx.fillRect(-CELL*0.1, CELL*0.1, CELL*0.08, CELL*0.2);
    ctx.fillRect(CELL*0.02, CELL*0.1, CELL*0.08, CELL*0.2);
    // Tunic
    ctx.fillStyle = isPlayer ? clothAlly : clothFoe;
    ctx.beginPath();
    ctx.moveTo(-CELL*0.18, -CELL*0.05);
    ctx.lineTo(CELL*0.18, -CELL*0.05);
    ctx.lineTo(CELL*0.2, CELL*0.15);
    ctx.lineTo(-CELL*0.2, CELL*0.15);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#1a0f05';ctx.lineWidth=1;ctx.stroke();
    // Belt
    ctx.fillStyle='#5a3a1e';
    ctx.fillRect(-CELL*0.18, CELL*0.08, CELL*0.36, CELL*0.04);
    ctx.fillStyle=teamGold;
    ctx.fillRect(-CELL*0.03, CELL*0.09, CELL*0.06, CELL*0.025);
    // Head
    ctx.fillStyle=skinTone;
    ctx.beginPath();ctx.arc(0, -CELL*0.18, CELL*0.12, 0, Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a0f05';ctx.lineWidth=0.8;ctx.stroke();
    // Helmet
    ctx.fillStyle='#8a9aaa';
    ctx.beginPath();
    ctx.arc(0, -CELL*0.22, CELL*0.13, Math.PI, 0);
    ctx.lineTo(CELL*0.13, -CELL*0.17);
    ctx.lineTo(-CELL*0.13, -CELL*0.17);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#5a5a6a';ctx.stroke();
    // Shield
    ctx.fillStyle=teamMain;
    ctx.beginPath();ctx.ellipse(CELL*0.2, -CELL*0.02, CELL*0.14, CELL*0.18, 0, 0, Math.PI*2);ctx.fill();
    ctx.strokeStyle=teamGold;ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=teamGold;
    ctx.beginPath();ctx.arc(CELL*0.2, -CELL*0.02, CELL*0.05, 0, Math.PI*2);ctx.fill();
    // Sword swing
    ctx.save();
    ctx.translate(CELL*0.1, -CELL*0.1);
    ctx.rotate(-Math.PI/4 + swing * Math.PI*0.8);
    ctx.fillStyle='#c8ccd4';
    ctx.fillRect(-CELL*0.02, -CELL*0.35, CELL*0.04, CELL*0.3);
    ctx.fillStyle=teamGold;
    ctx.fillRect(-CELL*0.05, -CELL*0.06, CELL*0.1, CELL*0.03);
    ctx.fillStyle='#5a3a1e';
    ctx.fillRect(-CELL*0.015, -CELL*0.03, CELL*0.03, CELL*0.06);
    ctx.restore();

  } else if(u.type === 'archer'){
    // Legs
    ctx.fillStyle='#3a2410';
    ctx.fillRect(-CELL*0.08, CELL*0.1, CELL*0.06, CELL*0.2);
    ctx.fillRect(CELL*0.02, CELL*0.1, CELL*0.06, CELL*0.2);
    // Cloak
    ctx.fillStyle = isPlayer ? '#2e6a3a' : '#6a2e1a';
    ctx.beginPath();
    ctx.moveTo(-CELL*0.16, -CELL*0.05);
    ctx.lineTo(CELL*0.16, -CELL*0.05);
    ctx.lineTo(CELL*0.14, CELL*0.18);
    ctx.lineTo(-CELL*0.14, CELL*0.18);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='#1a0f05';ctx.lineWidth=0.8;ctx.stroke();
    // Head
    ctx.fillStyle=skinTone;
    ctx.beginPath();ctx.arc(0, -CELL*0.18, CELL*0.11, 0, Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a0f05';ctx.lineWidth=0.8;ctx.stroke();
    // Hood
    ctx.fillStyle = isPlayer ? '#1e4a28' : '#4a1e10';
    ctx.beginPath();
    ctx.moveTo(-CELL*0.12, -CELL*0.2);
    ctx.quadraticCurveTo(0, -CELL*0.35, CELL*0.12, -CELL*0.2);
    ctx.lineTo(CELL*0.1, -CELL*0.15);
    ctx.lineTo(-CELL*0.1, -CELL*0.15);
    ctx.closePath();ctx.fill();
    // Bow
    ctx.save();
    ctx.translate(CELL*0.15, -CELL*0.05);
    ctx.strokeStyle='#5a3a1e';ctx.lineWidth=2;
    ctx.beginPath();
    ctx.arc(0, 0, CELL*0.25, -Math.PI/2.5, Math.PI/2.5);
    ctx.stroke();
    ctx.strokeStyle='#d4c890';ctx.lineWidth=0.8;
    const bowX = Math.cos(-Math.PI/2.5)*CELL*0.25;
    const bowY = Math.sin(-Math.PI/2.5)*CELL*0.25;
    const bowX2 = Math.cos(Math.PI/2.5)*CELL*0.25;
    const bowY2 = Math.sin(Math.PI/2.5)*CELL*0.25;
    ctx.beginPath();
    ctx.moveTo(bowX, bowY);
    ctx.lineTo(-CELL*0.1 - swing*CELL*0.1, 0);
    ctx.lineTo(bowX2, bowY2);
    ctx.stroke();
    if(swing > 0.2){
      ctx.fillStyle='#c8ccd4';
      ctx.fillRect(-CELL*0.1 - swing*CELL*0.1, -1, CELL*0.25, 2);
    }
    ctx.restore();
    // Quiver
    ctx.fillStyle='#5a3a1e';
    ctx.fillRect(-CELL*0.2, -CELL*0.12, CELL*0.06, CELL*0.25);
    ctx.fillStyle='#c8ccd4';
    for(let i=0;i<3;i++){
      ctx.fillRect(-CELL*0.19+i*CELL*0.015, -CELL*0.2-i*CELL*0.02, 1.5, CELL*0.1);
    }

  } else if(u.type === 'cavalry'){
    const horseColor = isPlayer ? '#6a4a28' : '#4a2818';
    const horseDark = isPlayer ? '#3a2810' : '#2a1408';
    // Horse body
    ctx.fillStyle=horseColor;
    ctx.beginPath();ctx.ellipse(0, CELL*0.12, CELL*0.32, CELL*0.15, 0, 0, Math.PI*2);ctx.fill();
    ctx.strokeStyle=horseDark;ctx.lineWidth=1;ctx.stroke();
    // Legs
    ctx.fillStyle=horseDark;
    ctx.fillRect(-CELL*0.22, CELL*0.2, CELL*0.05, CELL*0.12);
    ctx.fillRect(-CELL*0.08, CELL*0.22, CELL*0.05, CELL*0.1);
    ctx.fillRect(CELL*0.08, CELL*0.22, CELL*0.05, CELL*0.1);
    ctx.fillRect(CELL*0.2, CELL*0.2, CELL*0.05, CELL*0.12);
    // Head
    ctx.fillStyle=horseColor;
    ctx.beginPath();ctx.ellipse(CELL*0.3, CELL*0.02, CELL*0.14, CELL*0.1, -0.3, 0, Math.PI*2);ctx.fill();
    ctx.strokeStyle=horseDark;ctx.stroke();
    // Mane
    ctx.fillStyle=horseDark;
    ctx.beginPath();
    ctx.moveTo(CELL*0.18, -CELL*0.02);
    ctx.quadraticCurveTo(CELL*0.28, -CELL*0.12, CELL*0.38, -CELL*0.04);
    ctx.quadraticCurveTo(CELL*0.28, 0, CELL*0.18, -CELL*0.02);
    ctx.fill();
    // Tail
    ctx.fillStyle=horseDark;
    ctx.beginPath();
    ctx.moveTo(-CELL*0.32, CELL*0.08);
    ctx.quadraticCurveTo(-CELL*0.45, CELL*0.05, -CELL*0.42, CELL*0.2);
    ctx.quadraticCurveTo(-CELL*0.35, CELL*0.15, -CELL*0.32, CELL*0.12);
    ctx.fill();
    // Barding
    ctx.fillStyle=teamMain;ctx.globalAlpha=0.8;
    ctx.fillRect(-CELL*0.15, CELL*0.02, CELL*0.3, CELL*0.08);
    ctx.globalAlpha=1;
    ctx.strokeStyle=teamGold;ctx.lineWidth=0.8;
    ctx.strokeRect(-CELL*0.15, CELL*0.02, CELL*0.3, CELL*0.08);
    // Rider torso
    ctx.fillStyle = isPlayer ? clothAlly : clothFoe;
    ctx.fillRect(-CELL*0.1, -CELL*0.22, CELL*0.18, CELL*0.22);
    ctx.strokeStyle='#1a0f05';ctx.lineWidth=0.8;
    ctx.strokeRect(-CELL*0.1, -CELL*0.22, CELL*0.18, CELL*0.22);
    // Head
    ctx.fillStyle=skinTone;
    ctx.beginPath();ctx.arc(0, -CELL*0.32, CELL*0.09, 0, Math.PI*2);ctx.fill();
    ctx.strokeStyle='#1a0f05';ctx.stroke();
    // Helmet
    ctx.fillStyle='#8a9aaa';
    ctx.beginPath();
    ctx.arc(0, -CELL*0.35, CELL*0.1, Math.PI, 0);
    ctx.lineTo(CELL*0.1, -CELL*0.3);
    ctx.lineTo(-CELL*0.1, -CELL*0.3);
    ctx.closePath();ctx.fill();
    // Plume
    ctx.fillStyle=teamBright;
    ctx.beginPath();
    ctx.moveTo(0, -CELL*0.45);
    ctx.quadraticCurveTo(CELL*0.08, -CELL*0.5, CELL*0.12, -CELL*0.38);
    ctx.quadraticCurveTo(CELL*0.05, -CELL*0.42, 0, -CELL*0.45);
    ctx.fill();
    // Lance swing
    ctx.save();
    ctx.translate(CELL*0.1, -CELL*0.2);
    ctx.rotate(-Math.PI/6 + swing * Math.PI*0.4);
    ctx.fillStyle='#5a3a1e';
    ctx.fillRect(-CELL*0.02, -CELL*0.5, CELL*0.04, CELL*0.5);
    ctx.fillStyle='#c8ccd4';
    ctx.beginPath();
    ctx.moveTo(-CELL*0.04, -CELL*0.5);
    ctx.lineTo(0, -CELL*0.6);
    ctx.lineTo(CELL*0.04, -CELL*0.5);
    ctx.closePath();ctx.fill();
    ctx.fillStyle=teamBright;
    ctx.beginPath();
    ctx.moveTo(CELL*0.02, -CELL*0.4);
    ctx.lineTo(CELL*0.12, -CELL*0.38);
    ctx.lineTo(CELL*0.02, -CELL*0.33);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  // HP bar
  drawHPBar(u.x-CELL*0.4, u.y-CELL*0.55, CELL*0.8, 4, u.hp, u.maxHp, teamMain);
}

function drawDeathSkulls(){
  for(const u of units){
    if(u.alive||u.deathTimer<=0)continue;
    if(u.team==='enemy'&&!isEntityVisibleToPlayer(u))continue;
    const alpha = Math.min(1, u.deathTimer*1.5);
    const scale = 1 + (0.7-u.deathTimer)*0.6;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(u.x, u.y);
    ctx.scale(scale, scale);
    // Skull head
    ctx.fillStyle='#e8d9a8';
    ctx.beginPath();ctx.arc(0, -CELL*0.05, CELL*0.18, 0, Math.PI*2);ctx.fill();
    ctx.fillRect(-CELL*0.1, 0, CELL*0.2, CELL*0.1);
    // Eyes
    ctx.fillStyle='#1a0f05';
    ctx.beginPath();ctx.arc(-CELL*0.06, -CELL*0.08, CELL*0.04, 0, Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(CELL*0.06, -CELL*0.08, CELL*0.04, 0, Math.PI*2);ctx.fill();
    // Nose
    ctx.beginPath();
    ctx.moveTo(0, -CELL*0.02);
    ctx.lineTo(-CELL*0.02, CELL*0.03);
    ctx.lineTo(CELL*0.02, CELL*0.03);
    ctx.closePath();ctx.fill();
    // Teeth
    ctx.strokeStyle='#1a0f05';ctx.lineWidth=0.8;
    for(let i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(i*CELL*0.03, CELL*0.08);
      ctx.lineTo(i*CELL*0.03, CELL*0.12);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHPBar(x,y,w,h,hp,maxHp,color){
  // Dark outline
  ctx.fillStyle='#1a0f05';
  ctx.fillRect(x-1, y-1, w+2, h+2);
  // Wood background
  ctx.fillStyle='#3a2410';
  ctx.fillRect(x, y, w, h);
  const pct=Math.max(0,hp/maxHp);
  let fillColor = color;
  if(pct < 0.25) fillColor = '#b8301f';
  else if(pct < 0.5) fillColor = '#d4a63a';
  // Fill with gradient
  const hpGrad = ctx.createLinearGradient(x, y, x, y+h);
  hpGrad.addColorStop(0, shadeColor(fillColor, 30));
  hpGrad.addColorStop(0.5, fillColor);
  hpGrad.addColorStop(1, shadeColor(fillColor, -25));
  ctx.fillStyle=hpGrad;
  ctx.fillRect(x, y, w*pct, h);
  // Shine
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.fillRect(x, y, w*pct, h*0.4);
}

function drawProjectiles(){
  for(const p of projectiles){
    const dx=p.tx-p.x, dy=p.ty-p.y;
    const d = Math.hypot(dx,dy) || 1;
    const angle = Math.atan2(dy, dx);
    const arcOff = p.arc || 0;

    // Trail
    const trailColor = p.team==='player' ? 'rgba(244,207,91,0.4)' : 'rgba(228,85,63,0.4)';
    ctx.strokeStyle = trailColor;ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y + arcOff);
    ctx.lineTo(p.x - (dx/d)*14, p.y - (dy/d)*14 + arcOff);
    ctx.stroke();

    // Arrow sprite
    ctx.save();
    ctx.translate(p.x, p.y + arcOff);
    ctx.rotate(angle);
    // Shaft
    ctx.fillStyle='#5a3a1e';
    ctx.fillRect(-8, -0.8, 14, 1.6);
    // Head
    ctx.fillStyle='#c8ccd4';
    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(4, -2.5);
    ctx.lineTo(4, 2.5);
    ctx.closePath();ctx.fill();
    // Fletching (team color)
    ctx.fillStyle = p.team==='player' ? '#f4cf5b' : '#e4553f';
    ctx.beginPath();
    ctx.moveTo(-8, 0);
    ctx.lineTo(-5, -2);
    ctx.lineTo(-5, 2);
    ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0, Math.min(1, p.life*1.5));
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFogOverlay(){
  if(!fogGrid||!cloudCanvas||!fogOverlayCtx)return;
  const fc=fogOverlayCtx;fc.clearRect(0,0,W,H);
  for(let gy=0;gy<ROWS;gy++){for(let gx=0;gx<COLS;gx++){
    const state=fogGrid[gy*COLS+gx];const px=gx*CELL,py=gy*CELL;
    if(state===FOG_UNEXPLORED){const sx=px%cloudCanvas.width,sy=py%cloudCanvas.height;fc.drawImage(cloudCanvas,sx,sy,CELL,CELL,px,py,CELL,CELL);}
    else if(state===FOG_EXPLORED){
      const fogGrad = fc.createLinearGradient(px, py, px, py+CELL);
      fogGrad.addColorStop(0, 'rgba(40, 28, 14, 0.72)');
      fogGrad.addColorStop(1, 'rgba(25, 18, 8, 0.78)');
      fc.fillStyle = fogGrad;
      fc.fillRect(px,py,CELL,CELL);
    }
  }}
  ctx.drawImage(fogOverlayCanvas,0,0);
}

function drawBuildingShadows(){
  for(const[id,info]of exploredBuildings){
    const b=buildings.find(bb=>bb.id===id);if(!b||!b.alive)continue;
    if(isBuildingVisibleToPlayer(b))continue;if(!isCellExplored(b.gx,b.gy))continue;
    drawBuilding(b,true);
  }
}

function drawSelectionGlow(){
  // Yellow glow for selected friendly units
  const time=performance.now()/1000;const pulse=0.6+Math.sin(time*4)*0.2;
  for(const u of selectedUnits){
    if(!u.alive)continue;
    ctx.save();
    // Outer glow
    ctx.strokeStyle='#f4cf5b';ctx.lineWidth=3;ctx.globalAlpha=pulse;
    ctx.shadowColor='#f4cf5b';ctx.shadowBlur=18;
    ctx.beginPath();ctx.ellipse(u.x, u.y+CELL*0.15, CELL*0.55, CELL*0.22, 0, 0, Math.PI*2);ctx.stroke();
    // Inner rim
    ctx.shadowBlur=0;ctx.lineWidth=1.5;ctx.strokeStyle='#fff5cc';ctx.globalAlpha=pulse*0.8;
    ctx.beginPath();ctx.ellipse(u.x, u.y+CELL*0.15, CELL*0.5, CELL*0.2, 0, 0, Math.PI*2);ctx.stroke();
    ctx.restore();
  }
  // Target glow
  if(!selectedTarget||!selectedTarget.entity||!selectedTarget.entity.alive){selectedTarget=null;return;}
  const e=selectedTarget.entity;
  if(e.team==='enemy'&&!isCellVisible(Math.floor(e.x/CELL),Math.floor(e.y/CELL))&&!isCellExplored(Math.floor(e.x/CELL),Math.floor(e.y/CELL))){selectedTarget=null;return;}
  ctx.save();
  ctx.strokeStyle=selectedTarget.glowColor;
  ctx.lineWidth=e.type==='hq'?3.5:2.5;
  ctx.globalAlpha=pulse;
  ctx.shadowColor=selectedTarget.glowColor;
  ctx.shadowBlur=18;
  if(e.type==='hq'){
    ctx.strokeRect(e.x-CELL*1.1,e.y-CELL*1.1,CELL*2.2,CELL*2.2);
    ctx.lineWidth=1;ctx.strokeStyle='#f4cf5b';ctx.globalAlpha=pulse*0.5;
    ctx.strokeRect(e.x-CELL*1.18,e.y-CELL*1.18,CELL*2.36,CELL*2.36);
  } else if(e.type==='tower'){
    ctx.beginPath();ctx.arc(e.x,e.y,CELL*0.75,0,Math.PI*2);ctx.stroke();
  } else {
    ctx.beginPath();ctx.ellipse(e.x, e.y+CELL*0.15, CELL*0.55, CELL*0.22, 0, 0, Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}

function drawSelectionRect(){
  if(!isDragging||!mouseDownPos)return;
  const w1=screenToWorld(dragScreenStartX,dragScreenStartY);
  const w2=screenToWorld(dragScreenCurX,dragScreenCurY);
  const rx=Math.min(w1.x,w2.x),ry=Math.min(w1.y,w2.y);
  const rw=Math.abs(w2.x-w1.x),rh=Math.abs(w2.y-w1.y);
  // Parchment fill with subtle gold tint
  ctx.fillStyle='rgba(244,207,91,0.12)';ctx.fillRect(rx,ry,rw,rh);
  // Gold border
  ctx.strokeStyle='rgba(244,207,91,0.75)';ctx.lineWidth=1.5;ctx.strokeRect(rx,ry,rw,rh);
  // Corner diamonds
  ctx.fillStyle='#f4cf5b';
  const corners = [[rx,ry],[rx+rw,ry],[rx,ry+rh],[rx+rw,ry+rh]];
  for(const [cx,cy] of corners){
    ctx.beginPath();
    ctx.moveTo(cx, cy-3);
    ctx.lineTo(cx+3, cy);
    ctx.lineTo(cx, cy+3);
    ctx.lineTo(cx-3, cy);
    ctx.closePath();ctx.fill();
  }
}

function drawMoveCursor(){
  if(!moveCursor)return;
  ctx.save();
  ctx.globalAlpha=Math.min(1,moveCursor.timer*2);
  const pulse = 1 + Math.sin(performance.now()/200)*0.12;
  ctx.translate(moveCursor.x, moveCursor.y);
  ctx.scale(pulse, pulse);
  // Glowing ring
  ctx.strokeStyle='#f4cf5b';ctx.lineWidth=2.5;
  ctx.shadowColor='#f4cf5b';ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(0,0,CELL*0.4,0,Math.PI*2);ctx.stroke();
  ctx.shadowBlur=0;
  // Inner banner flag
  ctx.fillStyle='#8a1a10';
  ctx.beginPath();
  ctx.moveTo(0, -CELL*0.3);
  ctx.lineTo(CELL*0.2, -CELL*0.1);
  ctx.lineTo(0, CELL*0.05);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='#f4cf5b';ctx.lineWidth=1;ctx.stroke();
  // Pole
  ctx.strokeStyle='#5a3a1e';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(0, -CELL*0.3);ctx.lineTo(0, CELL*0.3);ctx.stroke();
  // Center dot
  ctx.fillStyle='#f4cf5b';
  ctx.beginPath();ctx.arc(0,0,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ===== MINIMAP =====
function drawMinimap(){
  const mx=VPW-MINIMAP_SIZE-MINIMAP_MARGIN, my=VPH-MINIMAP_SIZE-MINIMAP_MARGIN;
  // Ornate frame
  ctx.fillStyle='#1a0f05';
  ctx.fillRect(mx-4, my-4, MINIMAP_SIZE+8, MINIMAP_SIZE+8);
  ctx.strokeStyle='#8a6a1e';ctx.lineWidth=1.5;
  ctx.strokeRect(mx-4, my-4, MINIMAP_SIZE+8, MINIMAP_SIZE+8);
  ctx.strokeStyle='#f4cf5b';ctx.lineWidth=0.6;
  ctx.strokeRect(mx-2, my-2, MINIMAP_SIZE+4, MINIMAP_SIZE+4);
  // Parchment base
  const parchment = ctx.createLinearGradient(mx, my, mx, my+MINIMAP_SIZE);
  parchment.addColorStop(0, '#c9b37a');
  parchment.addColorStop(0.5, '#e8d9a8');
  parchment.addColorStop(1, '#a08858');
  ctx.fillStyle=parchment;
  ctx.fillRect(mx, my, MINIMAP_SIZE, MINIMAP_SIZE);

  // Cells
  for(let gy=0;gy<ROWS;gy++){for(let gx=0;gx<COLS;gx++){
    const state=getFogCell(gx,gy);
    const px=mx+gx*MINIMAP_CELL,py=my+gy*MINIMAP_CELL;
    if(state===FOG_UNEXPLORED){
      ctx.fillStyle='rgba(30,20,10,0.92)';ctx.fillRect(px,py,MINIMAP_CELL,MINIMAP_CELL);
    } else if(state===FOG_EXPLORED){
      ctx.fillStyle='rgba(70,50,30,0.5)';ctx.fillRect(px,py,MINIMAP_CELL,MINIMAP_CELL);
    } else {
      // Visible: grass
      ctx.fillStyle='rgba(60,100,40,0.55)';ctx.fillRect(px,py,MINIMAP_CELL,MINIMAP_CELL);
    }
  }}

  // Obstacles as rocks
  for(const obs of obstacles){
    if(!isCellExplored(obs.gx,obs.gy))continue;
    ctx.fillStyle='#4a4238';
    ctx.fillRect(mx+obs.gx*MINIMAP_CELL, my+obs.gy*MINIMAP_CELL, MINIMAP_CELL, MINIMAP_CELL);
  }

  // Buildings
  for(const b of buildings){
    if(!b.alive)continue;
    if(b.team==='enemy'&&!isBuildingVisibleToPlayer(b))continue;
    const mainColor = b.team==='player' ? '#2a6fc7' : '#b8301f';
    ctx.fillStyle=mainColor;
    const s = b.type==='hq' ? MINIMAP_CELL*1.3 : MINIMAP_CELL*0.9;
    ctx.fillRect(mx+b.gx*MINIMAP_CELL+(MINIMAP_CELL-s)/2, my+b.gy*MINIMAP_CELL+(MINIMAP_CELL-s)/2, s, s);
    ctx.strokeStyle='#f4cf5b';ctx.lineWidth=0.5;
    ctx.strokeRect(mx+b.gx*MINIMAP_CELL+(MINIMAP_CELL-s)/2, my+b.gy*MINIMAP_CELL+(MINIMAP_CELL-s)/2, s, s);
  }

  // Units
  for(const u of units){
    if(!u.alive)continue;
    if(u.team==='enemy'&&!isEntityVisibleToPlayer(u))continue;
    ctx.fillStyle=u.team==='player'?'#5a9df0':'#e4553f';
    ctx.beginPath();
    ctx.arc(mx+u.x/W*MINIMAP_SIZE, my+u.y/H*MINIMAP_SIZE, 1.8, 0, Math.PI*2);
    ctx.fill();
  }

  // Viewport rect (gold)
  ctx.strokeStyle='rgba(244,207,91,0.85)';ctx.lineWidth=1.2;
  ctx.strokeRect(mx+cameraX/W*MINIMAP_SIZE, my+cameraY/H*MINIMAP_SIZE, VPW/W*MINIMAP_SIZE, VPH/H*MINIMAP_SIZE);
}

function handleMinimapClick(sx,sy){
  const mx=VPW-MINIMAP_SIZE-MINIMAP_MARGIN, my=VPH-MINIMAP_SIZE-MINIMAP_MARGIN;
  if(sx>=mx&&sx<=mx+MINIMAP_SIZE&&sy>=my&&sy<=my+MINIMAP_SIZE){
    const wx=(sx-mx)/MINIMAP_SIZE*W;
    const wy=(sy-my)/MINIMAP_SIZE*H;
    jumpCameraTo(wx,wy);
    return true;
  }
  return false;
}

// ===== INPUT =====
document.addEventListener('contextmenu',e=>{if(phase==='combat')e.preventDefault();});

canvas.addEventListener('mousedown',e=>{
  if(phase!=='combat')return;
  const{sx,sy}=canvasCoords(e);

  if(e.button===0){ // left
    if(handleMinimapClick(sx,sy))return;
    mouseDownPos={sx,sy};
    dragScreenStartX=sx;dragScreenStartY=sy;
    dragScreenCurX=sx;dragScreenCurY=sy;
    isDragging=false;
  }
});

canvas.addEventListener('mousemove',e=>{
  mouseX=e.clientX;mouseY=e.clientY;
  if(mouseDownPos&&e.buttons&1){
    const{sx,sy}=canvasCoords(e);
    dragScreenCurX=sx;dragScreenCurY=sy;
    if(Math.hypot(sx-dragScreenStartX,sy-dragScreenStartY)>DRAG_THRESHOLD)isDragging=true;
  }
});

canvas.addEventListener('mouseup',e=>{
  if(phase!=='combat')return;
  const{sx,sy}=canvasCoords(e);
  const w=screenToWorld(sx,sy);

  if(e.button===0){ // left release
    if(isDragging){
      // Box select
      const w1=screenToWorld(dragScreenStartX,dragScreenStartY);
      const w2=screenToWorld(sx,sy);
      const rx1=Math.min(w1.x,w2.x),ry1=Math.min(w1.y,w2.y);
      const rx2=Math.max(w1.x,w2.x),ry2=Math.max(w1.y,w2.y);
      selectedUnits=units.filter(u=>u.alive&&u.team==='player'&&u.x>=rx1&&u.x<=rx2&&u.y>=ry1&&u.y<=ry2);
    } else {
      // Single click - toggle friendly unit selection
      const clickedFriendly=units.find(u=>u.alive&&u.team==='player'&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
      if(clickedFriendly){
        const idx=selectedUnits.indexOf(clickedFriendly);
        if(idx>=0)selectedUnits.splice(idx,1); else selectedUnits.push(clickedFriendly);
      } else {
        // Click on enemy for glow (informational)
        const clickedEnemy=units.find(u=>u.alive&&u.team==='enemy'&&isEntityVisibleToPlayer(u)&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
        const clickedEBldg=buildings.find(b=>b.alive&&b.team==='enemy'&&(isBuildingVisibleToPlayer(b)||isBuildingExplored(b))&&dist(b,{x:w.x,y:w.y})<CELL*(b.type==='hq'?1.2:0.7));
        if(clickedEnemy) selectedTarget={entity:clickedEnemy,glowColor:'#ef4444'};
        else if(clickedEBldg) selectedTarget={entity:clickedEBldg,glowColor:clickedEBldg.type==='hq'?'#ff2222':'#f97316'};
        else {selectedUnits=[];selectedTarget=null;}
      }
    }
    mouseDownPos=null;isDragging=false;
  }

  if(e.button===2){ // right click
    const ring=document.createElement('div');ring.className='click-ring';
    const rect=canvas.getBoundingClientRect();
    ring.style.left=(e.clientX)+'px';ring.style.top=(e.clientY)+'px';

    // BUG-006: If no units selected, use all non-retreating player units (全军推进)
    const cmdUnits = selectedUnits.length > 0 ? selectedUnits : units.filter(u=>u.alive&&u.team==='player'&&!u.retreating);

    // Check right-click on visible enemy
    const clickedEnemy=units.find(u=>u.alive&&u.team==='enemy'&&isEntityVisibleToPlayer(u)&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
    const clickedEBldg=buildings.find(b=>b.alive&&b.team==='enemy'&&(isBuildingVisibleToPlayer(b)||isBuildingExplored(b))&&dist(b,{x:w.x,y:w.y})<CELL*(b.type==='hq'?1.2:0.7));

    if(clickedEnemy||clickedEBldg){
      const target=clickedEnemy||clickedEBldg;
      ring.classList.add('attack');
      cmdUnits.forEach(u=>{u.command={type:'focus',target};u.idle=false;u.retreating=false;});
      selectedTarget={entity:target,glowColor:target.team==='enemy'?'#ef4444':'#f97316'};
    } else {
      // Check right-click on friendly (retreat)
      const clickedFriendly=units.find(u=>u.alive&&u.team==='player'&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
      if(clickedFriendly){
        ring.classList.add('retreat');
        clickedFriendly.retreating=true;
      } else {
        // Move command
        cmdUnits.forEach(u=>{u.command={type:'move',x:w.x,y:w.y};u.idle=false;u.target=null;});
        moveCursor={x:w.x,y:w.y,timer:3};
        // BUG-008: clear cursor shortly after command issued (0.5s)
        setTimeout(()=>{if(moveCursor&&moveCursor.x===w.x&&moveCursor.y===w.y)moveCursor=null;},500);
      }
    }
    $('click-feedback').appendChild(ring);setTimeout(()=>ring.remove(),600);
  }
});

document.addEventListener('keydown',e=>{keysDown.add(e.key.toLowerCase());});
document.addEventListener('keyup',e=>{keysDown.delete(e.key.toLowerCase());});

// ===== TACTICAL PRIORITY =====
$('btn-priority-back').addEventListener('click',()=>{
  tacticalPriority=tacticalPriority==='back'?null:'back';
  updatePriorityUI();
});
$('btn-priority-front').addEventListener('click',()=>{
  tacticalPriority=tacticalPriority==='front'?null:'front';
  updatePriorityUI();
});
function updatePriorityUI(){
  $('btn-priority-back').classList.toggle('active',tacticalPriority==='back');
  $('btn-priority-front').classList.toggle('active',tacticalPriority==='front');
}

// ===== EVENTS =====
$('btn-start').addEventListener('click',showFormationUI);
$('btn-back-deploy').addEventListener('click',()=>{showScreen('deploy-screen');phase='deploy';});
$('btn-confirm-formation').addEventListener('click',confirmFormation);
$('btn-replay').addEventListener('click',initDeploy);
$('btn-accept').addEventListener('click',acceptAdvice);
$('btn-reject').addEventListener('click',dismissAdvisor);

// ===== INIT =====
initDeploy();
</script>
