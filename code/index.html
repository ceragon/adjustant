<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 副官：智战 — Azeroth Chronicles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=MedievalSharp&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#e8d9a8;--parchment-dark:#c9b37a;
  --ink:#2b1d0e;--ink-soft:#4a3722;
  --gold:#d4a63a;--gold-bright:#f4cf5b;--gold-deep:#8a6a1e;
  --wood:#5a3a1e;--wood-dark:#3a2410;--wood-light:#7a5228;
  --stone:#6a6258;--stone-dark:#3d3832;
  --team-ally:#2a6fc7;--team-ally-bright:#5a9df0;
  --team-foe:#b8301f;--team-foe-bright:#e4553f;
  --blood:#8a1a10;--grass:#3e6b2a;--grass-dark:#2a4a1c;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:radial-gradient(ellipse at top, #3a2410 0%, #1a0f05 60%, #0a0604 100%);
  color:var(--parchment);
  font-family:'IM Fell English','Cinzel',Georgia,serif;
  overflow:hidden;height:100vh;letter-spacing:.3px;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:100;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.04) 0px, rgba(0,0,0,.04) 1px, transparent 1px, transparent 3px),
    radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.screen{display:none;width:100%;height:100vh;position:relative;}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}

.deploy-header{text-align:center;margin-bottom:28px;position:relative;}
.deploy-header h1{
  font-family:'Cinzel',serif;font-weight:900;font-size:2.8em;
  color:var(--gold-bright);letter-spacing:6px;
  text-shadow:0 0 1px var(--gold-deep),0 2px 0 var(--gold-deep),
    0 4px 8px rgba(0,0,0,.6),0 0 40px rgba(244,207,91,.25);
}
.deploy-header h1::before,.deploy-header h1::after{
  content:'✦';color:var(--gold);margin:0 18px;font-size:.7em;vertical-align:middle;
  text-shadow:0 0 10px var(--gold-bright);
}
.subtitle{color:var(--parchment-dark);margin-top:10px;font-size:1.05em;font-style:italic;letter-spacing:1px;}
.unit-selector{display:flex;gap:24px;margin:20px 0;}
.unit-card{
  background:linear-gradient(180deg,#3d2a16 0%,#2a1c0c 100%);
  border:2px solid var(--gold-deep);border-radius:4px;
  padding:24px 22px;width:220px;text-align:center;position:relative;
  box-shadow:inset 0 0 0 1px #1a0f05,inset 0 0 0 4px #6a4a22,inset 0 0 0 5px #1a0f05,0 6px 16px rgba(0,0,0,.6);
  transition:all .25s;
}
.unit-card::before{content:'';position:absolute;inset:6px;border:1px solid rgba(212,166,58,.15);border-radius:2px;pointer-events:none;}
.unit-card:hover{
  border-color:var(--gold-bright);transform:translateY(-4px);
  box-shadow:inset 0 0 0 1px #1a0f05,inset 0 0 0 4px #a07830,inset 0 0 0 5px #1a0f05,
    0 10px 24px rgba(0,0,0,.7),0 0 30px rgba(244,207,91,.2);
}
.unit-icon{font-size:48px;margin-bottom:8px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.8));}
.unit-name{
  font-family:'Cinzel',serif;font-weight:700;font-size:1.3em;
  color:var(--gold-bright);letter-spacing:3px;margin-bottom:6px;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.unit-desc{font-size:.85em;color:var(--parchment-dark);margin-bottom:12px;line-height:1.4;font-style:italic;}
.unit-stats{
  font-size:.78em;color:var(--parchment);margin-bottom:14px;text-align:left;line-height:1.75;
  background:rgba(0,0,0,.25);padding:8px 10px;border-radius:2px;
  border:1px solid rgba(212,166,58,.2);font-family:'IM Fell English',serif;
}
.counter{display:flex;align-items:center;justify-content:center;gap:14px;}
.counter button{
  width:36px;height:36px;border-radius:50%;
  border:2px solid var(--gold-deep);
  background:radial-gradient(circle at 30% 30%,#6a4a22,#2a1c0c);
  color:var(--gold-bright);font-size:1.2em;font-weight:700;
  cursor:pointer;transition:all .15s;
  box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 0 rgba(244,207,91,.3);
  font-family:'Cinzel',serif;
}
.counter button:hover{background:radial-gradient(circle at 30% 30%,#8a6a32,#3a2810);border-color:var(--gold-bright);}
.counter button:disabled{opacity:.3;cursor:default;}
.counter .count{font-size:1.7em;font-weight:900;min-width:32px;text-align:center;color:var(--parchment);font-family:'Cinzel',serif;text-shadow:0 1px 2px rgba(0,0,0,.8);}
.deploy-footer{display:flex;align-items:center;gap:24px;margin-top:22px;}
.unit-count{font-size:1.05em;color:var(--parchment-dark);font-family:'Cinzel',serif;letter-spacing:1px;}
.unit-count span{color:var(--gold-bright);font-weight:700;}
.btn-primary{
  padding:14px 42px;border:2px solid var(--gold);
  background:linear-gradient(180deg,#8a1a10 0%,#5a0e08 50%,#3a0804 100%);
  color:var(--gold-bright);
  font-family:'Cinzel',serif;font-weight:700;font-size:1.05em;
  cursor:pointer;transition:all .2s;letter-spacing:3px;
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 10px rgba(244,207,91,.4);
  box-shadow:inset 0 0 0 1px #1a0f05,inset 0 2px 0 rgba(244,207,91,.2),0 4px 10px rgba(0,0,0,.6);
  text-transform:uppercase;
}
.btn-primary:hover:not(:disabled){
  transform:translateY(-2px);
  background:linear-gradient(180deg,#b8241a 0%,#7a1408 50%,#4a0a06 100%);
  box-shadow:inset 0 0 0 1px #1a0f05,inset 0 2px 0 rgba(244,207,91,.3),0 8px 20px rgba(0,0,0,.7),0 0 30px rgba(244,207,91,.3);
  color:#fff;
}
.btn-primary:disabled{opacity:.35;cursor:default;filter:grayscale(.5);}

#formation-screen{background:radial-gradient(ellipse at center,#2a1c0c 0%,#1a0f05 100%);padding:24px;gap:18px;}
.formation-title{font-family:'Cinzel',serif;font-weight:900;font-size:1.8em;color:var(--gold-bright);letter-spacing:5px;text-shadow:0 2px 4px rgba(0,0,0,.8),0 0 20px rgba(244,207,91,.2);}
.formation-subtitle{font-size:.9em;color:var(--parchment-dark);margin-top:6px;font-style:italic;}
.formation-body{display:flex;gap:28px;align-items:flex-start;margin-top:12px;}
.formation-units{display:flex;flex-wrap:wrap;gap:10px;max-width:480px;}
.funit{
  width:58px;height:72px;border:2px solid var(--wood-light);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
  background:linear-gradient(180deg,#3d2a16,#2a1c0c);user-select:none;
  box-shadow:inset 0 0 0 1px #1a0f05,0 2px 4px rgba(0,0,0,.5);
}
.funit:hover{border-color:var(--gold);transform:translateY(-2px);}
.funit .ficon{font-size:24px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8));}
.funit .frow{font-size:.62em;margin-top:4px;font-weight:700;font-family:'Cinzel',serif;letter-spacing:1px;text-shadow:0 1px 1px rgba(0,0,0,.8);}
.funit.front{border-color:#c94a2a;background:linear-gradient(180deg,rgba(201,74,42,.25),#2a1c0c);}
.funit.front .frow{color:#ff8866;}
.funit.mid{border-color:var(--gold);background:linear-gradient(180deg,rgba(212,166,58,.2),#2a1c0c);}
.funit.mid .frow{color:var(--gold-bright);}
.funit.back{border-color:var(--team-ally-bright);background:linear-gradient(180deg,rgba(90,157,240,.2),#2a1c0c);}
.funit.back .frow{color:var(--team-ally-bright);}
.formation-lanes{display:flex;flex-direction:column;gap:10px;min-width:220px;}
.flane{padding:10px 14px;border:1px dashed var(--wood-light);border-radius:3px;min-height:48px;background:rgba(0,0,0,.3);}
.flane-label{font-size:.8em;font-weight:700;margin-bottom:4px;font-family:'Cinzel',serif;letter-spacing:2px;}
.flane.front .flane-label{color:#ff8866;}
.flane.mid .flane-label{color:var(--gold-bright);}
.flane.back .flane-label{color:var(--team-ally-bright);}
.flane-count{font-size:.85em;color:var(--parchment-dark);}
.formation-warnings{font-size:.82em;color:#ff8866;min-height:22px;margin-top:6px;font-style:italic;}
.formation-preview{border:3px solid var(--gold-deep);border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px #1a0f05,inset 0 0 0 3px #6a4a22,0 4px 14px rgba(0,0,0,.7);}
.formation-footer{margin-top:12px;display:flex;align-items:center;gap:18px;}

#combat-screen{position:relative;}
#combat-screen.active{justify-content:flex-start;}
#combat-hud{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:10px 20px;
  background:linear-gradient(180deg,#4a2f18 0%,#2e1c0c 50%,#1a0f05 100%);
  border-bottom:2px solid var(--gold-deep);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.6),inset 0 1px 0 rgba(244,207,91,.15),0 4px 10px rgba(0,0,0,.6);
  z-index:10;position:relative;
}
#combat-hud::before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0px,rgba(0,0,0,.08) 2px,transparent 2px,transparent 6px);pointer-events:none;opacity:.5;}
.hud-left,.hud-right{flex:1;position:relative;}
.hud-right{text-align:right;}
.hud-center{flex:0 0 auto;}
#timer{
  font-family:'Cinzel',serif;font-weight:900;font-size:1.8em;color:var(--gold-bright);
  font-variant-numeric:tabular-nums;letter-spacing:3px;
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 15px rgba(244,207,91,.3);
  padding:2px 16px;border:1px solid var(--gold-deep);background:rgba(0,0,0,.4);border-radius:2px;
}
.bar-label{font-size:.82em;color:var(--gold);font-family:'Cinzel',serif;font-weight:600;letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.8);}
.hp-bar{
  width:200px;height:16px;background:linear-gradient(180deg,#1a0f05,#0a0604);
  border:1px solid var(--gold-deep);border-radius:2px;overflow:hidden;margin-top:5px;
  display:inline-block;position:relative;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 1px 0 rgba(244,207,91,.15);
}
.hp-bar::after{content:'';position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent);pointer-events:none;}
.hp-fill{height:100%;transition:width .3s;position:relative;}
.hp-fill.blue{background:linear-gradient(180deg,#6ab0ff 0%,#2a6fc7 50%,#1a4a8a 100%);width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 8px rgba(90,157,240,.4);}
.hp-fill.red{background:linear-gradient(180deg,#ff7055 0%,#b8301f 50%,#7a1a10 100%);width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 8px rgba(228,85,63,.4);}
#game-canvas{display:block;background:#2a4a1c;cursor:default;flex:1;width:100%;box-shadow:inset 0 0 60px rgba(0,0,0,.4);}

#advisor-panel{
  position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,rgba(74,47,24,.96),rgba(26,15,5,.96));
  border:2px solid var(--gold);border-radius:3px;
  padding:12px 20px;display:none;align-items:center;gap:14px;max-width:580px;z-index:20;
  box-shadow:inset 0 0 0 1px #1a0f05,0 8px 24px rgba(0,0,0,.8),0 0 30px rgba(244,207,91,.15);
}
#advisor-panel.show{display:flex;}
#advisor-msg{font-size:.9em;color:var(--parchment);flex:1;line-height:1.5;}
#advisor-msg::before{content:'⚜ 副官: ';color:var(--gold-bright);font-weight:700;font-family:'Cinzel',serif;letter-spacing:1px;}
.btn-small{
  padding:7px 18px;border:1px solid;border-radius:2px;font-size:.82em;
  cursor:pointer;font-weight:700;font-family:'Cinzel',serif;letter-spacing:2px;
  text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 2px 4px rgba(0,0,0,.5);
}
.btn-accept{background:linear-gradient(180deg,#2a6b1e,#1a4010);color:var(--gold-bright);border-color:#4a9a2e;}
.btn-reject{background:linear-gradient(180deg,#4a3722,#2a1c0c);color:var(--parchment);border-color:var(--wood-light);}
.btn-accept:hover{background:linear-gradient(180deg,#3a8a28,#2a5a18);}
.btn-reject:hover{background:linear-gradient(180deg,#6a4a22,#3a2810);}

#click-feedback{position:absolute;pointer-events:none;z-index:15;}
.click-ring{
  position:absolute;width:42px;height:42px;border:2px solid var(--gold-bright);border-radius:50%;
  transform:translate(-50%,-50%);animation:ringPulse .6s ease-out forwards;pointer-events:none;
  box-shadow:0 0 12px var(--gold-bright),inset 0 0 6px rgba(244,207,91,.4);
}
.click-ring.attack{border-color:#ff6040;box-shadow:0 0 12px #ff6040,inset 0 0 6px rgba(255,96,64,.4);}
.click-ring.retreat{border-color:#66dd44;box-shadow:0 0 12px #66dd44,inset 0 0 6px rgba(102,221,68,.4);}
@keyframes ringPulse{0%{opacity:1;transform:translate(-50%,-50%) scale(.4);border-width:3px;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8);border-width:1px;}}

#combat-hints{position:absolute;top:58px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;opacity:.75;}
#combat-hints span{font-size:.72em;color:var(--parchment);background:linear-gradient(180deg,rgba(74,47,24,.85),rgba(26,15,5,.85));border:1px solid var(--gold-deep);padding:4px 10px;border-radius:2px;font-family:'Cinzel',serif;letter-spacing:1px;text-shadow:0 1px 1px rgba(0,0,0,.8);}

#priority-panel{position:absolute;top:58px;right:16px;display:flex;flex-direction:column;gap:7px;z-index:10;}
.priority-btn{
  padding:7px 14px;border:1px solid var(--gold-deep);border-radius:2px;
  background:linear-gradient(180deg,#3d2a16,#1a0f05);color:var(--parchment);
  font-size:.78em;cursor:pointer;transition:all .15s;text-align:center;
  font-family:'Cinzel',serif;font-weight:600;letter-spacing:2px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.5);
}
.priority-btn:hover{border-color:var(--gold);color:var(--gold-bright);}
.priority-btn.active{background:linear-gradient(180deg,#8a1a10,#4a0804);border-color:var(--gold-bright);color:var(--gold-bright);box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),0 0 14px rgba(244,207,91,.3);}

#result-screen{background:radial-gradient(ellipse at center,#2a1c0c 0%,#0a0604 100%);}
.result-content{text-align:center;}
#result-title{
  font-family:'Cinzel',serif;font-weight:900;font-size:4em;margin-bottom:30px;letter-spacing:10px;
  text-shadow:0 0 1px currentColor,0 4px 0 rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.8),0 0 60px currentColor;
}
#result-stats{
  margin-bottom:30px;font-size:1em;color:var(--parchment);line-height:2.2;
  background:linear-gradient(180deg,rgba(74,47,24,.6),rgba(26,15,5,.6));
  border:2px solid var(--gold-deep);padding:20px 40px;border-radius:3px;
  box-shadow:inset 0 0 0 1px #1a0f05,0 8px 24px rgba(0,0,0,.7);
  font-family:'IM Fell English',serif;display:inline-block;
}
.win{color:var(--gold-bright);}
.lose{color:var(--team-foe-bright);}
.draw{color:var(--parchment-dark);}

.dmg-num{
  position:absolute;pointer-events:none;font-weight:900;
  font-family:'Cinzel',serif;font-size:15px;
  animation:dmgFloat .9s cubic-bezier(.2,.6,.3,1) forwards;z-index:15;
  text-shadow:0 0 2px #000,0 0 2px #000,0 2px 4px rgba(0,0,0,.9),1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;
  letter-spacing:1px;
}
@keyframes dmgFloat{
  0%{opacity:0;transform:translateY(6px) scale(.5);}
  15%{opacity:1;transform:translateY(-2px) scale(1.2);}
  40%{transform:translateY(-12px) scale(1);}
  100%{opacity:0;transform:translateY(-36px) scale(.9);}
}
::selection{background:var(--gold);color:var(--ink);}
</style>
</head>
<body>
<div id="app">
  <!-- DEPLOY -->
  <div id="deploy-screen" class="screen active">
    <div class="deploy-header">
      <h1>AI 副官：智战</h1>
      <p class="subtitle">选择你的部队编制 — 共 8 个单位</p>
    </div>
    <div class="unit-selector"></div>
    <div class="deploy-footer">
      <div class="unit-count">已选择: <span id="total-units">0</span> / 8</div>
      <button id="btn-start" class="btn-primary" disabled>部署阵型</button>
    </div>
  </div>

  <!-- FORMATION -->
  <div id="formation-screen" class="screen">
    <div class="formation-title">部署阵型</div>
    <div class="formation-subtitle">点击单位图标切换前排/中排/后排</div>
    <div class="formation-body">
      <div>
        <div class="formation-units" id="formation-units"></div>
        <div class="formation-warnings" id="formation-warnings"></div>
      </div>
      <div>
        <div class="formation-lanes" id="formation-lanes"></div>
      </div>
      <canvas id="formation-preview" class="formation-preview" width="280" height="280"></canvas>
    </div>
    <div class="formation-footer">
      <button id="btn-back-deploy" class="btn-primary" style="background:linear-gradient(180deg,#5a3a1e,#2a1c0c);">返回选择</button>
      <button id="btn-confirm-formation" class="btn-primary">确认开战</button>
    </div>
  </div>

  <!-- COMBAT -->
  <div id="combat-screen" class="screen">
    <div id="combat-hud">
      <div class="hud-left">
        <span class="bar-label">我方主堡</span>
        <div class="hp-bar"><div id="player-hq-hp" class="hp-fill blue"></div></div>
      </div>
      <div class="hud-center"><div id="timer">03:00</div></div>
      <div class="hud-right">
        <span class="bar-label">敌方主堡</span>
        <div class="hp-bar"><div id="enemy-hq-hp" class="hp-fill red"></div></div>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="advisor-panel">
      <div id="advisor-msg"></div>
      <div><button id="btn-accept" class="btn-small btn-accept">采纳</button> <button id="btn-reject" class="btn-small btn-reject">拒绝</button></div>
    </div>
    <div id="combat-hints">
      <span>左键选择/框选</span><span>右键移动/攻击</span><span>WASD/边缘滚动</span>
    </div>
    <div id="priority-panel">
      <button id="btn-priority-back" class="priority-btn">集火后排</button>
      <button id="btn-priority-front" class="priority-btn">集火前排</button>
    </div>
    <div id="click-feedback"></div>
  </div>

  <!-- RESULT -->
  <div id="result-screen" class="screen">
    <div class="result-content">
      <h1 id="result-title"></h1>
      <div id="result-stats"></div>
      <button id="btn-replay" class="btn-primary">再来一局</button>
    </div>
  </div>
</div>

<script>
// ===== CONSTANTS =====
const CELL = 40;
const COLS = 21, ROWS = 21;
const W = COLS * CELL, H = ROWS * CELL; // 840x840 world
const VIEWPORT_CELLS = 15;
const VPW = VIEWPORT_CELLS * CELL, VPH = VIEWPORT_CELLS * CELL; // 600x600 viewport
const MAX_UNITS = 8;
const BATTLE_TIME = 180;
const COUNTER_BONUS = 1.6;
const EDGE_SCROLL_MARGIN = 10;
const EDGE_SCROLL_SPEED = 400;
const CAMERA_SPEED = 500;
const DRAG_THRESHOLD = 5;
const MINIMAP_SIZE = 168;
const MINIMAP_CELL = MINIMAP_SIZE / COLS; // 8px per cell
const MINIMAP_MARGIN = 10;
const FOG_UNEXPLORED = 0, FOG_EXPLORED = 1, FOG_VISIBLE = 2;
const BUILDING_VISION_RANGE = 4;
const FOG_TICK_INTERVAL = 0.1;

const UNIT_DEFS = {
  infantry:{name:'步兵',icon:'⚔',hp:160,atk:16,range:1.5,speed:1.2,atkSpeed:1.4,desc:'血量高、近战、攻击慢',color:'#3b82f6',eColor:'#ef4444',counter:'cavalry'},
  archer:{name:'射手',icon:'🏹',hp:85,atk:28,range:5,speed:1,atkSpeed:2.2,desc:'血量低、远程、攻击力高',color:'#22d3ee',eColor:'#f97316',counter:'infantry'},
  cavalry:{name:'骑兵',icon:'🐎',hp:125,atk:22,range:2,speed:2.2,atkSpeed:1.5,desc:'机动性强、中距离攻击',color:'#a78bfa',eColor:'#fb923c',counter:'archer'}
};

// Spawn configs: 3 left, 3 right. Towers flank HQ at Y±1
const SPAWN_CONFIGS = {
  left:[

// ===== UTILS =====
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function cellDist(a,b){return dist(a,b)/CELL;}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}

// Deterministic noise for decoration placement
function fastNoise(x,y,seed){
  let h = (x*374761393 + y*668265263 + seed*2654435761) | 0;
  h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
  h = Math.imul(h ^ (h >>> 13), 0x45d9f3b);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function shadeColor(hex, percent){
  const f = parseInt(hex.slice(1),16);
  const t = percent < 0 ? 0 : 255;
  const p = Math.abs(percent)/100;
  const R = f>>16, G = (f>>8)&0x00FF, B = f&0x0000FF;
  return '#' + (0x1000000 + (Math.round((t-R)*p)+R)*0x10000 + (Math.round((t-G)*p)+G)*0x100 + (Math.round((t-B)*p)+B)).toString(16).slice(1);
}


// Camera helpers
function clampCamera(){
  cameraX = clamp(cameraX, 0, Math.max(0, W - VPW));
  cameraY = clamp(cameraY, 0, Math.max(0, H - VPH));
}
function screenToWorld(sx,sy){return {x:sx+cameraX, y:sy+cameraY};}
function worldToScreen(wx,wy){return {x:wx-cameraX, y:wy-cameraY};}

function updateCamera(dt){
  let dx=0, dy=0;
  if(keysDown.has('a')||keysDown.has('arrowleft')) dx -= CAMERA_SPEED*dt;
  if(keysDown.has('d')||keysDown.has('arrowright')) dx += CAMERA_SPEED*dt;
  if(keysDown.has('w')||keysDown.has('arrowup')) dy -= CAMERA_SPEED*dt;
  if(keysDown.has('s')||keysDown.has('arrowdown')) dy += CAMERA_SPEED*dt;
  // Edge scrolling (only when not dragging)
  if(!isDragging && !mouseDownPos){
    const rect = canvas.getBoundingClientRect();
    const relX = mouseX - rect.left, relY = mouseY - rect.top;
    if(relX < EDGE_SCROLL_MARGIN && relX >= 0) dx -= EDGE_SCROLL_SPEED*dt;
    if(relX > rect.width - EDGE_SCROLL_MARGIN && relX <= rect.width) dx += EDGE_SCROLL_SPEED*dt;
    if(relY < EDGE_SCROLL_MARGIN && relY >= 0) dy -= EDGE_SCROLL_SPEED*dt;
    if(relY > rect.height - EDGE_SCROLL_MARGIN && relY <= rect.height) dy += EDGE_SCROLL_SPEED*dt;
  }
  if(dx||dy){cameraX+=dx;cameraY+=dy;clampCamera();}
}

function jumpCameraTo(wx,wy){
  cameraX = wx - VPW/2;
  cameraY = wy - VPH/2;
  clampCamera();
}

// Canvas coords from mouse event (accounting for CSS scaling)
function canvasCoords(e){
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (VPW / rect.width);
  const sy = (e.clientY - rect.top) * (VPH / rect.height);
  return {sx, sy};
}

function renderDeployCards(){
  const c=document.querySelector('.unit-selector');c.innerHTML='';
  for(const[key,def]of Object.entries(UNIT_DEFS)){
    const card=document.createElement('div');card.className='unit-card';
    card.innerHTML=`<span class="unit-icon">${def.icon}</span><div class="unit-name">${def.name}</div>
      <div class="unit-desc">${def.desc}</div>
      <div class="unit-stats">❤️ ${def.hp} ⚔ ${def.atk}<br>📏 ${def.range} 💨 ${def.speed}<br>🎯 克制: ${UNIT_DEFS[def.counter].name}</div>
      <div class="counter"><button class="btn-minus" data-unit="${key}">−</button><span class="count" id="count-${key}">0</span><button class="btn-plus" data-unit="${key}">+</button></div>`;
    c.appendChild(card);
  }
  c.querySelectorAll('.btn-plus').forEach(b=>b.addEventListener('click',()=>changeCount(b.dataset.unit,1)));
  c.querySelectorAll('.btn-minus').forEach(b=>b.addEventListener('click',()=>changeCount(b.dataset.unit,-1)));
  updateDeployUI();
}

function changeCount(unit,delta){
  const total=Object.values(selected).reduce((a,b)=>a+b,0);
  const nv=selected[unit]+delta;
  if(nv<0||(delta>0&&total>=MAX_UNITS))return;
  selected[unit]=nv;updateDeployUI();
}

function updateDeployUI(){
  const total=Object.values(selected).reduce((a,b)=>a+b,0);
  $('total-units').textContent=total;
  $('btn-start').disabled=total!==MAX_UNITS;
  for(const key of Object.keys(UNIT_DEFS)){const el=$('count-'+key);if(el)el.textContent=selected[key];}
  document.querySelectorAll('.btn-plus').forEach(b=>{b.disabled=Object.values(selected).reduce((a,b)=>a+b,0)>=MAX_UNITS;});
  document.querySelectorAll('.btn-minus').forEach(b=>{b.disabled=selected[b.dataset.unit]<=0;});
}

  formationUnitList.forEach((type,i)=>{

    container.appendChild(el);
  });

  // Lanes
  const lanes=$('formation-lanes');lanes.innerHTML='';
  const counts={front:0,mid:0,back:0};
  formationUnitList.forEach((_,i)=>counts[formationAssignments[i]]++);
  for(const[row,label]of[['front','前排 (Front)'],['mid','中排 (Mid)'],['back','后排 (Back)']]){

    lanes.appendChild(lane);
  }

  if(counts.back===0) warns.push('⚠ 后排为空，无远程输出');
  $('formation-warnings').textContent=warns.join(' ');

  // Preview canvas
  renderFormationPreview();
}

function cycleFormationRow(i){
  const cycle={front:'mid',mid:'back',back:'front'};
  formationAssignments[i]=cycle[formationAssignments[i]];
}

function renderFormationPreview(){
  const pc=$('formation-preview');
  const pctx=pc.getContext('2d');
  const pw=pc.width, ph=pc.height;
  const sc=pw/W; // scale factor
  pctx.clearRect(0,0,pw,ph);
  // Grass base
  const grassGrad = pctx.createLinearGradient(0,0,0,ph);
  grassGrad.addColorStop(0,'#3a6624');
  grassGrad.addColorStop(0.5,'#2f5420');
  grassGrad.addColorStop(1,'#264418');
  pctx.fillStyle=grassGrad;
  pctx.fillRect(0,0,pw,ph);
  // Grid
  pctx.strokeStyle='rgba(0,0,0,.18)';pctx.lineWidth=0.5;
  for(let x=0;x<=W;x+=CELL){pctx.beginPath();pctx.moveTo(x*sc,0);pctx.lineTo(x*sc,ph);pctx.stroke();}
  for(let y=0;y<=H;y+=CELL){pctx.beginPath();pctx.moveTo(0,y*sc);pctx.lineTo(pw,y*sc);pctx.stroke();}
  // Obstacles as rocks
  for(const obs of obstacles){
    const rx=obs.gx*CELL*sc, ry=obs.gy*CELL*sc, rs=CELL*sc;
    pctx.fillStyle='#4a4238';
    pctx.fillRect(rx+1,ry+1,rs-2,rs-2);
    pctx.fillStyle='#6a6058';
    pctx.beginPath();
    pctx.ellipse(rx+rs*0.5,ry+rs*0.55,rs*0.38,rs*0.3,0,0,Math.PI*2);
    pctx.fill();
  }
  // Player buildings
  const pcfg = pendingSpawnConfigs.player;
  const hx=(pcfg.hq[0]*CELL+CELL/2)*sc, hy=(pcfg.hq[1]*CELL+CELL/2)*sc;
  pctx.fillStyle='#2a6fc7';
  pctx.fillRect(hx-CELL*sc, hy-CELL*sc, CELL*2*sc, CELL*2*sc);
  pctx.strokeStyle='#f4cf5b';pctx.lineWidth=1.5;
  pctx.strokeRect(hx-CELL*sc, hy-CELL*sc, CELL*2*sc, CELL*2*sc);
  for(const t of pcfg.towers){
    const tx=(t[0]*CELL+CELL/2)*sc, ty=(t[1]*CELL+CELL/2)*sc;
    pctx.fillStyle='#3a7ad0';
    pctx.beginPath();pctx.arc(tx,ty,CELL*0.5*sc,0,Math.PI*2);pctx.fill();
    pctx.strokeStyle='#f4cf5b';pctx.stroke();
  }
  // Enemy side fog (warm brown)
  const isPlayerLeft = pcfg.hq[0] < COLS/2;
  pctx.fillStyle='rgba(30,20,10,0.75)';
  if(isPlayerLeft){pctx.fillRect(W/2*sc,0,pw,ph);}
  else{pctx.fillRect(0,0,W/2*sc,ph);}

  // Formation row indicators
  const hqX = (pcfg.hq[0]*CELL+CELL/2)*sc;
  const hqY = (pcfg.hq[1]*CELL+CELL/2)*sc;
  const frontDir = isPlayerLeft ? 1 : -1;
  const offsets = {front:3*CELL*sc*frontDir, mid:0, back:-2*CELL*sc*frontDir};
  const colors = {front:'#ef4444',mid:'#f59e0b',back:'#3b82f6'};
  for(const[row,ox] of Object.entries(offsets)){
    const counts = formationUnitList.filter((_,i)=>formationAssignments[i]===row).length;
    if(counts>0){
      pctx.fillStyle=colors[row];
      pctx.globalAlpha=0.3;
      pctx.fillRect(hx+ox-CELL*0.3*sc, hy-CELL*2*sc, CELL*0.6*sc, CELL*4*sc);
      pctx.globalAlpha=1;
    }
  }
}

// ===== CLASSES =====
class Unit {
  constructor(type,team,gx,gy){
    const def=UNIT_DEFS[type];
    this.type=type;this.team=team;
    this.hp=def.hp;this.maxHp=def.hp;this.atk=def.atk;this.range=def.range;
    this.speed=def.speed;this.atkSpeed=def.atkSpeed;this.counter=def.counter;
    this.x=gx*CELL+CELL/2;this.y=gy*CELL+CELL/2;
    this.atkCooldown=0;this.alive=true;this.target=null;
    this.retreating=false;this.deathTimer=0;this.flashTimer=0;
    this.formationRow=null;
    this.command=null; // per-unit command {type:'move'|'focus', x?, y?, target?}
    this.idle=true;
    this.facing = team==='player' ? 0 : Math.PI;
    this.swingAnim = 0;
  }
  get gx(){return Math.floor(this.x/CELL);}
  get gy(){return Math.floor(this.y/CELL);}
}

class Building {
  constructor(type,team,gx,gy){
    this.type=type;this.team=team;this.gx=gx;this.gy=gy;
    this.x=gx*CELL+CELL/2;this.y=gy*CELL+CELL/2;
    this.alive=true;this.flashTimer=0;
    if(type==='hq'){this.hp=600;this.maxHp=600;this.atk=0;this.range=0;this.atkCooldown=0;}
    else{this.hp=250;this.maxHp=250;this.atk=18;this.range=6;this.atkCooldown=0;this.atkSpeed=2.5;}
  }
  get id(){return this.team+'_'+this.type+'_'+this.gx+'_'+this.gy;}
}

// ===== OBSTACLES =====
function initObstacles(){
  obstacles=[];obstacleSet=new Set();
  // DEEP-005: Collect all spawn point cells (HQ + towers) to exclude from obstacles
  const spawnCells=new Set();
  for(const side of ['left','right']){
    for(const cfg of SPAWN_CONFIGS[side]){
      spawnCells.add(cfg.hq[0]+','+cfg.hq[1]);
      for(const t of cfg.towers) spawnCells.add(t[0]+','+t[1]);
    }
  }
  // Symmetric 21x21 layout — skip any cell that overlaps a spawn point
  const blocks=[
    [10,8],[10,12],[8,10],[12,10], // central cross
    [4,4],[5,4],[4,5],             // top-left cluster
    [16,4],[15,4],[16,5],          // top-right
    [4,16],[5,16],[4,15],          // bottom-left
    [16,16],[15,16],[16,15],       // bottom-right
    [10,3],[10,17],[3,10],[17,10]  // mid-edges
  ];
  for(const[gx,gy]of blocks){
    const key=gx+','+gy;
    if(!spawnCells.has(key)){obstacles.push({gx,gy});obstacleSet.add(key);}
  }
}
function isObstacle(gx,gy){return obstacleSet.has(gx+','+gy);}
function isObstacleAt(x,y){return isObstacle(Math.floor(x/CELL),Math.floor(y/CELL));}
function hasLineOfSight(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1);const steps=Math.ceil(d/(CELL*0.5));
  for(let i=1;i<steps;i++){const t=i/steps;if(isObstacleAt(x1+(x2-x1)*t,y1+(y2-y1)*t))return false;}
  return true;
}

// ===== TERRAIN (Warcraft-style grass/dirt) =====
function initTerrain(){
  grassSeed = Math.floor(Math.random()*10000)+1;
  terrainCanvas = document.createElement('canvas');
  terrainCanvas.width = W;
  terrainCanvas.height = H;
  const tctx = terrainCanvas.getContext('2d');

  const grad = tctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, Math.max(W,H));
  grad.addColorStop(0, '#4a7a32');
  grad.addColorStop(0.4, '#3a6624');
  grad.addColorStop(0.8, '#2a4a18');
  grad.addColorStop(1, '#1e3812');
  tctx.fillStyle = grad;
  tctx.fillRect(0, 0, W, H);

  // Per-cell variation
  for(let gy=0; gy<ROWS; gy++){
    for(let gx=0; gx<COLS; gx++){
      const cx = gx*CELL, cy = gy*CELL;
      const n1 = fastNoise(gx,gy,grassSeed);
      const n2 = fastNoise(gx+101,gy+37,grassSeed);
      const n3 = fastNoise(gx*3,gy*5,grassSeed+1);
      const tint = 0.85 + n1*0.3;
      tctx.fillStyle = `rgba(${Math.floor(60*tint)}, ${Math.floor(110*tint)}, ${Math.floor(40*tint)}, 0.35)`;
      tctx.fillRect(cx, cy, CELL, CELL);

      // Dirt patches
      if(n2 > 0.88){
        tctx.fillStyle = `rgba(90, 60, 30, ${0.25 + n3*0.25})`;
        tctx.beginPath();
        tctx.ellipse(cx + n3*CELL, cy + n2*CELL, CELL*0.3, CELL*0.2, n1*Math.PI, 0, Math.PI*2);
        tctx.fill();
      }
      // Grass blades
      for(let b=0; b<3; b++){
        const bn = fastNoise(gx*7+b, gy*11+b, grassSeed+2);
        const bn2 = fastNoise(gx*13+b, gy*17+b, grassSeed+3);
        const bx = cx + bn*CELL;
        const by = cy + bn2*CELL;
        tctx.strokeStyle = `rgba(${50+Math.floor(bn*40)}, ${100+Math.floor(bn2*60)}, ${30+Math.floor(bn*20)}, 0.5)`;
        tctx.lineWidth = 1;
        tctx.beginPath();
        tctx.moveTo(bx, by);
        tctx.lineTo(bx + (bn-0.5)*4, by - 3 - bn2*3);
        tctx.stroke();
      }
    }
  }

  // Ultra-subtle grid (nearly invisible)
  tctx.strokeStyle = 'rgba(0,0,0,0.015)';
  tctx.lineWidth = 1;
  for(let x=0;x<=W;x+=CELL){tctx.beginPath();tctx.moveTo(x,0);tctx.lineTo(x,H);tctx.stroke();}
  for(let y=0;y<=H;y+=CELL){tctx.beginPath();tctx.moveTo(0,y);tctx.lineTo(W,y);tctx.stroke();}

  // Center dirt crossroads
  const midX = Math.floor(COLS/2)*CELL + CELL/2;
  const midY = Math.floor(ROWS/2)*CELL + CELL/2;
  const centerGrad = tctx.createRadialGradient(midX, midY, 0, midX, midY, CELL*4);
  centerGrad.addColorStop(0, 'rgba(110, 80, 40, 0.28)');
  centerGrad.addColorStop(1, 'rgba(110, 80, 40, 0)');
  tctx.fillStyle = centerGrad;
  tctx.fillRect(0,0,W,H);

  // Territory tint
  const playerSide = pendingSpawnConfigs ? pendingSpawnConfigs.player.hq[0] : 3;
  const isLeft = playerSide < COLS/2;
  tctx.fillStyle = 'rgba(42, 111, 199, 0.07)';
  tctx.fillRect(isLeft?0:W/2, 0, W/2, H);
  tctx.fillStyle = 'rgba(184, 48, 31, 0.07)';
  tctx.fillRect(isLeft?W/2:0, 0, W/2, H);

  // Decorative trees at edges, bushes elsewhere (non-blocking)
  decorationList = [];
  for(let gy=0; gy<ROWS; gy++){
    for(let gx=0; gx<COLS; gx++){
      if(isObstacle(gx,gy)) continue;
      const dn = fastNoise(gx*3+7, gy*3+13, grassSeed+99);
      const atEdge = gx<2 || gx>=COLS-2 || gy<2 || gy>=ROWS-2;
      if(atEdge && dn > 0.82){
        decorationList.push({type:'tree', gx, gy, seed: (dn*1000)|0});
      } else if(!atEdge && dn > 0.95 && !isBuildingCell(gx,gy)){
        decorationList.push({type:'bush', gx, gy, seed: (dn*1000)|0});
      }
    }
  }
}

function isBuildingCell(gx,gy){
  for(const side of ['left','right']){
    for(const cfg of SPAWN_CONFIGS[side]){
      if(Math.abs(cfg.hq[0]-gx)<=1 && Math.abs(cfg.hq[1]-gy)<=1) return true;
      for(const t of cfg.towers){
        if(Math.abs(t[0]-gx)<=1 && Math.abs(t[1]-gy)<=1) return true;
      }
    }
  }
  return false;
}
