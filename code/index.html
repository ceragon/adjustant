<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 副官：智战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0e17;color:#c8d6e5;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;}
.screen{display:none;width:100%;height:100vh;}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* Deploy */
.deploy-header{text-align:center;margin-bottom:24px;}
.deploy-header h1{font-size:2.2em;color:#e2e8f0;letter-spacing:2px;}
.subtitle{color:#64748b;margin-top:6px;font-size:1em;}
.unit-selector{display:flex;gap:20px;margin:16px 0;}
.unit-card{background:#131a2b;border:2px solid #1e293b;border-radius:14px;padding:22px 20px;width:200px;text-align:center;transition:border-color .2s;}
.unit-card:hover{border-color:#334155;}
.unit-icon{font-size:44px;margin-bottom:8px;display:block;}
.unit-name{font-size:1.2em;font-weight:700;margin-bottom:4px;}
.unit-desc{font-size:.8em;color:#64748b;margin-bottom:10px;line-height:1.3;}
.unit-stats{font-size:.75em;color:#94a3b8;margin-bottom:12px;text-align:left;line-height:1.6;}
.counter{display:flex;align-items:center;justify-content:center;gap:12px;}
.counter button{width:32px;height:32px;border-radius:50%;border:2px solid #334155;background:#1e293b;color:#e2e8f0;font-size:1.1em;cursor:pointer;transition:all .15s;}
.counter button:hover{background:#334155;border-color:#475569;}
.counter button:disabled{opacity:.3;cursor:default;}
.counter .count{font-size:1.4em;font-weight:700;min-width:28px;text-align:center;}
.deploy-footer{display:flex;align-items:center;gap:20px;margin-top:16px;}
.unit-count{font-size:1em;color:#94a3b8;}
.btn-primary{padding:12px 36px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;font-size:1em;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:1px;}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,.35);}
.btn-primary:disabled{opacity:.35;cursor:default;}

/* Formation */
#formation-screen{background:#0a0e17;padding:20px;gap:16px;}
.formation-title{font-size:1.6em;font-weight:700;color:#e2e8f0;}
.formation-subtitle{font-size:.85em;color:#64748b;margin-top:4px;}
.formation-body{display:flex;gap:24px;align-items:flex-start;margin-top:10px;}
.formation-units{display:flex;flex-wrap:wrap;gap:8px;max-width:480px;}
.funit{width:54px;height:68px;border:2px solid #334155;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;background:#131a2b;user-select:none;}
.funit:hover{border-color:#475569;}
.funit .ficon{font-size:22px;}
.funit .frow{font-size:.6em;margin-top:2px;font-weight:600;}
.funit.front{border-color:#ef4444;background:rgba(239,68,68,.1);}
.funit.front .frow{color:#ef4444;}
.funit.mid{border-color:#f59e0b;background:rgba(245,158,11,.1);}
.funit.mid .frow{color:#f59e0b;}
.funit.back{border-color:#3b82f6;background:rgba(59,130,246,.1);}
.funit.back .frow{color:#3b82f6;}
.formation-lanes{display:flex;flex-direction:column;gap:8px;min-width:200px;}
.flane{padding:8px 12px;border:1px dashed #334155;border-radius:8px;min-height:44px;}
.flane-label{font-size:.75em;font-weight:700;margin-bottom:4px;}
.flane.front .flane-label{color:#ef4444;}
.flane.mid .flane-label{color:#f59e0b;}
.flane.back .flane-label{color:#3b82f6;}
.flane-count{font-size:.8em;color:#94a3b8;}
.formation-warnings{font-size:.78em;color:#f59e0b;min-height:20px;margin-top:4px;}
.formation-preview{border:1px solid #1e293b;border-radius:8px;overflow:hidden;}
.formation-footer{margin-top:10px;display:flex;align-items:center;gap:16px;}

/* Combat HUD */
#combat-screen{position:relative;}
#combat-screen.active{justify-content:flex-start;}
#combat-hud{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 16px;background:#0d1220;z-index:10;}
.hud-left,.hud-right{flex:1;}
.hud-right{text-align:right;}
.hud-center{flex:0 0 auto;}
#timer{font-size:1.6em;font-weight:700;color:#e2e8f0;font-variant-numeric:tabular-nums;}
.bar-label{font-size:.78em;color:#94a3b8;}
.hp-bar{width:160px;height:12px;background:#1e293b;border-radius:6px;overflow:hidden;margin-top:3px;display:inline-block;}
.hp-fill{height:100%;border-radius:6px;transition:width .3s;}
.hp-fill.blue{background:linear-gradient(90deg,#3b82f6,#60a5fa);width:100%;}
.hp-fill.red{background:linear-gradient(90deg,#ef4444,#f87171);width:100%;}
#game-canvas{display:block;background:#0f1625;cursor:default;flex:1;width:100%;}

/* Advisor */
#advisor-panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,22,37,.92);border:1px solid #1e293b;border-radius:10px;padding:10px 16px;display:none;align-items:center;gap:10px;max-width:520px;backdrop-filter:blur(8px);z-index:20;}
#advisor-panel.show{display:flex;}
#advisor-msg{font-size:.85em;color:#cbd5e1;flex:1;}
#advisor-msg::before{content:'🎖 副官: ';color:#f59e0b;font-weight:600;}
.btn-small{padding:5px 14px;border:none;border-radius:6px;font-size:.78em;cursor:pointer;font-weight:600;}
.btn-accept{background:#22c55e;color:#fff;}
.btn-reject{background:#475569;color:#cbd5e1;}
.btn-accept:hover{background:#16a34a;}
.btn-reject:hover{background:#64748b;}

/* Click feedback */
#click-feedback{position:absolute;pointer-events:none;z-index:15;}
.click-ring{position:absolute;width:36px;height:36px;border:2px solid #3b82f6;border-radius:50%;transform:translate(-50%,-50%);animation:ringPulse .6s ease-out forwards;pointer-events:none;}
.click-ring.attack{border-color:#ef4444;}
.click-ring.retreat{border-color:#22c55e;}
@keyframes ringPulse{0%{opacity:1;transform:translate(-50%,-50%) scale(.5);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5);}}

/* Combat hints */
#combat-hints{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:10;opacity:.5;}
#combat-hints span{font-size:.7em;color:#94a3b8;background:rgba(15,22,37,.7);padding:3px 8px;border-radius:5px;}

/* Priority panel */
#priority-panel{position:absolute;top:50px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:10;}
.priority-btn{padding:5px 12px;border:1px solid #334155;border-radius:6px;background:#131a2b;color:#94a3b8;font-size:.75em;cursor:pointer;transition:all .15s;text-align:center;}
.priority-btn:hover{border-color:#475569;}
.priority-btn.active{background:#1e40af;border-color:#3b82f6;color:#e2e8f0;}

/* Result */
.result-content{text-align:center;}
#result-title{font-size:2.6em;margin-bottom:24px;}
#result-stats{margin-bottom:24px;font-size:.95em;color:#94a3b8;line-height:2;}
.win{color:#22c55e;}.lose{color:#ef4444;}.draw{color:#f59e0b;}

/* Damage numbers */
.dmg-num{position:absolute;pointer-events:none;font-weight:700;font-size:13px;animation:dmgFloat .8s ease-out forwards;z-index:15;text-shadow:0 1px 3px rgba(0,0,0,.7);}
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-28px);}}
</style>
</head>
<body>
<div id="app">
  <!-- DEPLOY -->
  <div id="deploy-screen" class="screen active">
    <div class="deploy-header">
      <h1>AI 副官：智战</h1>
      <p class="subtitle">选择你的部队编制 — 共 8 个单位</p>
    </div>
    <div class="unit-selector"></div>
    <div class="deploy-footer">
      <div class="unit-count">已选择: <span id="total-units">0</span> / 8</div>
      <button id="btn-start" class="btn-primary" disabled>部署阵型</button>
    </div>
  </div>

  <!-- FORMATION -->
  <div id="formation-screen" class="screen">
    <div class="formation-title">部署阵型</div>
    <div class="formation-subtitle">点击单位图标切换前排/中排/后排</div>
    <div class="formation-body">
      <div>
        <div class="formation-units" id="formation-units"></div>
        <div class="formation-warnings" id="formation-warnings"></div>
      </div>
      <div>
        <div class="formation-lanes" id="formation-lanes"></div>
      </div>
      <canvas id="formation-preview" class="formation-preview" width="280" height="280"></canvas>
    </div>
    <div class="formation-footer">
      <button id="btn-back-deploy" class="btn-primary" style="background:#475569;">返回选择</button>
      <button id="btn-confirm-formation" class="btn-primary">确认开战</button>
    </div>
  </div>

  <!-- COMBAT -->
  <div id="combat-screen" class="screen">
    <div id="combat-hud">
      <div class="hud-left">
        <span class="bar-label">我方主堡</span>
        <div class="hp-bar"><div id="player-hq-hp" class="hp-fill blue"></div></div>
      </div>
      <div class="hud-center"><div id="timer">03:00</div></div>
      <div class="hud-right">
        <span class="bar-label">敌方主堡</span>
        <div class="hp-bar"><div id="enemy-hq-hp" class="hp-fill red"></div></div>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <div id="advisor-panel">
      <div id="advisor-msg"></div>
      <div><button id="btn-accept" class="btn-small btn-accept">采纳</button> <button id="btn-reject" class="btn-small btn-reject">拒绝</button></div>
    </div>
    <div id="combat-hints">
      <span>左键选择/框选</span><span>右键移动/攻击</span><span>WASD/边缘滚动</span>
    </div>
    <div id="priority-panel">
      <button id="btn-priority-back" class="priority-btn">集火后排</button>
      <button id="btn-priority-front" class="priority-btn">集火前排</button>
    </div>
    <div id="click-feedback"></div>
  </div>

  <!-- RESULT -->
  <div id="result-screen" class="screen">
    <div class="result-content">
      <h1 id="result-title"></h1>
      <div id="result-stats"></div>
      <button id="btn-replay" class="btn-primary">再来一局</button>
    </div>
  </div>
</div>

<script>
// ===== CONSTANTS =====
const CELL = 40;
const COLS = 21, ROWS = 21;
const W = COLS * CELL, H = ROWS * CELL; // 840x840 world
const VIEWPORT_CELLS = 15;
const VPW = VIEWPORT_CELLS * CELL, VPH = VIEWPORT_CELLS * CELL; // 600x600 viewport
const MAX_UNITS = 8;
const BATTLE_TIME = 180;
const COUNTER_BONUS = 1.6;
const EDGE_SCROLL_MARGIN = 40;
const EDGE_SCROLL_SPEED = 400;
const CAMERA_SPEED = 500;
const DRAG_THRESHOLD = 5;
const MINIMAP_SIZE = 168;
const MINIMAP_CELL = MINIMAP_SIZE / COLS; // 8px per cell
const MINIMAP_MARGIN = 10;
const FOG_UNEXPLORED = 0, FOG_EXPLORED = 1, FOG_VISIBLE = 2;
const BUILDING_VISION_RANGE = 4;
const FOG_TICK_INTERVAL = 0.1;

const UNIT_DEFS = {
  infantry:{name:'步兵',icon:'⚔',hp:160,atk:16,range:1.5,speed:1.2,atkSpeed:1.4,desc:'血量高、近战、攻击慢',color:'#3b82f6',eColor:'#ef4444',counter:'cavalry'},
  archer:{name:'射手',icon:'🏹',hp:85,atk:28,range:5,speed:1,atkSpeed:2.2,desc:'血量低、远程、攻击力高',color:'#22d3ee',eColor:'#f97316',counter:'infantry'},
  cavalry:{name:'骑兵',icon:'🐎',hp:125,atk:22,range:2,speed:2.2,atkSpeed:1.5,desc:'机动性强、中距离攻击',color:'#a78bfa',eColor:'#fb923c',counter:'archer'}
};

// Spawn configs: 3 left, 3 right. Towers flank HQ at Y±1
const SPAWN_CONFIGS = {
  left:[
    {hq:[3,10],towers:[[3,9],[3,11]]},
    {hq:[2,5],towers:[[2,4],[2,6]]},
    {hq:[2,15],towers:[[2,14],[2,16]]}
  ],
  right:[
    {hq:[17,10],towers:[[17,9],[17,11]]},
    {hq:[18,5],towers:[[18,4],[18,6]]},
    {hq:[18,15],towers:[[18,14],[18,16]]}
  ]
};

// ===== STATE =====
let phase = 'deploy';
let selected = {infantry:0,archer:0,cavalry:0};
let units = [], buildings = [], projectiles = [], particles = [];
let battleTimer = BATTLE_TIME, lastTime = 0, animId = null;
let advisorTimer = 0, advisorActive = false, advisorAction = null;
let selectedTarget = null; // enemy glow target
let selectedUnits = [];    // player-selected friendly units
let obstacles = [], obstacleSet = new Set();
let moveCursor = null;
let canvasScale = 1;

// Camera
let cameraX = 0, cameraY = 0;
let mouseX = 0, mouseY = 0;
let keysDown = new Set();

// Selection drag
let isDragging = false, mouseDownPos = null;
let dragScreenStartX = 0, dragScreenStartY = 0;
let dragScreenCurX = 0, dragScreenCurY = 0;

// Fog
let fogGrid = null, cloudCanvas = null, fogOverlayCanvas = null, fogOverlayCtx = null;
let visionTickTimer = 0;
let exploredBuildings = new Map();

// Formation
let formationUnitList = [];
let formationAssignments = {};
let pendingSpawnConfigs = null;

// Tactical priority
let tacticalPriority = null; // null | 'back' | 'front'

// ===== DOM =====
const $ = id => document.getElementById(id);
const canvas = $('game-canvas');
const ctx = canvas.getContext('2d');

// ===== UTILS =====
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function cellDist(a,b){return dist(a,b)/CELL;}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}

// Camera helpers
function clampCamera(){
  cameraX = clamp(cameraX, 0, Math.max(0, W - VPW));
  cameraY = clamp(cameraY, 0, Math.max(0, H - VPH));
}
function screenToWorld(sx,sy){return {x:sx+cameraX, y:sy+cameraY};}
function worldToScreen(wx,wy){return {x:wx-cameraX, y:wy-cameraY};}

function updateCamera(dt){
  let dx=0, dy=0;
  if(keysDown.has('a')||keysDown.has('arrowleft')) dx -= CAMERA_SPEED*dt;
  if(keysDown.has('d')||keysDown.has('arrowright')) dx += CAMERA_SPEED*dt;
  if(keysDown.has('w')||keysDown.has('arrowup')) dy -= CAMERA_SPEED*dt;
  if(keysDown.has('s')||keysDown.has('arrowdown')) dy += CAMERA_SPEED*dt;
  // Edge scrolling (only when not dragging)
  if(!isDragging && !mouseDownPos){
    const rect = canvas.getBoundingClientRect();
    const relX = mouseX - rect.left, relY = mouseY - rect.top;
    if(relX < EDGE_SCROLL_MARGIN && relX >= 0) dx -= EDGE_SCROLL_SPEED*dt;
    if(relX > rect.width - EDGE_SCROLL_MARGIN && relX <= rect.width) dx += EDGE_SCROLL_SPEED*dt;
    if(relY < EDGE_SCROLL_MARGIN && relY >= 0) dy -= EDGE_SCROLL_SPEED*dt;
    if(relY > rect.height - EDGE_SCROLL_MARGIN && relY <= rect.height) dy += EDGE_SCROLL_SPEED*dt;
  }
  if(dx||dy){cameraX+=dx;cameraY+=dy;clampCamera();}
}

function jumpCameraTo(wx,wy){
  cameraX = wx - VPW/2;
  cameraY = wy - VPH/2;
  clampCamera();
}

// Canvas coords from mouse event (accounting for CSS scaling)
function canvasCoords(e){
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (VPW / rect.width);
  const sy = (e.clientY - rect.top) * (VPH / rect.height);
  return {sx, sy};
}

// ===== DEPLOY =====
function initDeploy(){
  phase='deploy';
  selected={infantry:0,archer:0,cavalry:0};
  units=[];buildings=[];projectiles=[];particles=[];
  battleTimer=BATTLE_TIME;advisorTimer=0;advisorActive=false;
  selectedTarget=null;selectedUnits=[];moveCursor=null;
  tacticalPriority=null;
  formationUnitList=[];formationAssignments={};pendingSpawnConfigs=null;
  keysDown.clear();
  if(animId)cancelAnimationFrame(animId);
  showScreen('deploy-screen');
  renderDeployCards();
}

function renderDeployCards(){
  const c=document.querySelector('.unit-selector');c.innerHTML='';
  for(const[key,def]of Object.entries(UNIT_DEFS)){
    const card=document.createElement('div');card.className='unit-card';
    card.innerHTML=`<span class="unit-icon">${def.icon}</span><div class="unit-name">${def.name}</div>
      <div class="unit-desc">${def.desc}</div>
      <div class="unit-stats">❤️ ${def.hp} ⚔ ${def.atk}<br>📏 ${def.range} 💨 ${def.speed}<br>🎯 克制: ${UNIT_DEFS[def.counter].name}</div>
      <div class="counter"><button class="btn-minus" data-unit="${key}">−</button><span class="count" id="count-${key}">0</span><button class="btn-plus" data-unit="${key}">+</button></div>`;
    c.appendChild(card);
  }
  c.querySelectorAll('.btn-plus').forEach(b=>b.addEventListener('click',()=>changeCount(b.dataset.unit,1)));
  c.querySelectorAll('.btn-minus').forEach(b=>b.addEventListener('click',()=>changeCount(b.dataset.unit,-1)));
  updateDeployUI();
}

function changeCount(unit,delta){
  const total=Object.values(selected).reduce((a,b)=>a+b,0);
  const nv=selected[unit]+delta;
  if(nv<0||(delta>0&&total>=MAX_UNITS))return;
  selected[unit]=nv;updateDeployUI();
}

function updateDeployUI(){
  const total=Object.values(selected).reduce((a,b)=>a+b,0);
  $('total-units').textContent=total;
  $('btn-start').disabled=total!==MAX_UNITS;
  for(const key of Object.keys(UNIT_DEFS)){const el=$('count-'+key);if(el)el.textContent=selected[key];}
  document.querySelectorAll('.btn-plus').forEach(b=>{b.disabled=Object.values(selected).reduce((a,b)=>a+b,0)>=MAX_UNITS;});
  document.querySelectorAll('.btn-minus').forEach(b=>{b.disabled=selected[b.dataset.unit]<=0;});
}

// ===== FORMATION =====
function showFormationUI(){
  phase='formation';
  formationUnitList=[];
  formationAssignments={};
  for(const[type,count]of Object.entries(selected)){
    for(let i=0;i<count;i++) formationUnitList.push(type);
  }
  formationUnitList.forEach((_,i)=>{formationAssignments[i]='mid';});

  // Pre-pick spawn configs and init obstacles for preview
  pendingSpawnConfigs = pickSpawnConfigs();
  initObstacles();

  showScreen('formation-screen');
  renderFormationUI();
}

function renderFormationUI(){
  const container=$('formation-units');
  container.innerHTML='';
  const rowNames={front:'前排',mid:'中排',back:'后排'};
  formationUnitList.forEach((type,i)=>{
    const def=UNIT_DEFS[type];
    const row=formationAssignments[i];
    const el=document.createElement('div');
    el.className='funit '+row;
    el.innerHTML=`<span class="ficon">${def.icon}</span><span class="frow">${rowNames[row]}</span>`;
    el.addEventListener('click',()=>{cycleFormationRow(i);renderFormationUI();});
    container.appendChild(el);
  });

  // Lanes
  const lanes=$('formation-lanes');lanes.innerHTML='';
  const counts={front:0,mid:0,back:0};
  formationUnitList.forEach((_,i)=>counts[formationAssignments[i]]++);
  for(const[row,label]of[['front','前排 (Front)'],['mid','中排 (Mid)'],['back','后排 (Back)']]){
    const lane=document.createElement('div');lane.className='flane '+row;
    lane.innerHTML=`<div class="flane-label">${label}</div><div class="flane-count">${counts[row]} 个单位</div>`;
    lanes.appendChild(lane);
  }

  // Warnings
  const warns=[];
  if(counts.front===0) warns.push('⚠ 前排为空，无肉盾保护');
  if(counts.back===0) warns.push('⚠ 后排为空，无远程输出');
  $('formation-warnings').textContent=warns.join(' ');

  // Preview canvas
  renderFormationPreview();
}

function cycleFormationRow(i){
  const cycle={front:'mid',mid:'back',back:'front'};
  formationAssignments[i]=cycle[formationAssignments[i]];
}

function renderFormationPreview(){
  const pc=$('formation-preview');
  const pctx=pc.getContext('2d');
  const pw=pc.width, ph=pc.height;
  const sc=pw/W; // scale factor
  pctx.clearRect(0,0,pw,ph);
  pctx.fillStyle='#0f1625';pctx.fillRect(0,0,pw,ph);

  // Grid
  pctx.strokeStyle='#151d30';pctx.lineWidth=0.5;
  for(let x=0;x<=W;x+=CELL){pctx.beginPath();pctx.moveTo(x*sc,0);pctx.lineTo(x*sc,ph);pctx.stroke();}
  for(let y=0;y<=H;y+=CELL){pctx.beginPath();pctx.moveTo(0,y*sc);pctx.lineTo(pw,y*sc);pctx.stroke();}

  // Obstacles
  for(const obs of obstacles){
    pctx.fillStyle='#1a2035';
    pctx.fillRect(obs.gx*CELL*sc, obs.gy*CELL*sc, CELL*sc, CELL*sc);
  }

  // Player buildings from spawn config
  const pcfg = pendingSpawnConfigs.player;
  // HQ
  pctx.fillStyle='#3b82f6';
  pctx.fillRect((pcfg.hq[0]*CELL+CELL/2-CELL*0.5)*sc, (pcfg.hq[1]*CELL+CELL/2-CELL*0.5)*sc, CELL*sc, CELL*sc);
  // Towers
  for(const t of pcfg.towers){
    pctx.fillStyle='#2563eb';
    pctx.beginPath();pctx.arc((t[0]*CELL+CELL/2)*sc,(t[1]*CELL+CELL/2)*sc,CELL*0.3*sc,0,Math.PI*2);pctx.fill();
  }

  // Fog: right half (enemy side) darkened
  const isPlayerLeft = pcfg.hq[0] < COLS/2;
  if(isPlayerLeft){
    pctx.fillStyle='rgba(20,20,30,0.7)';
    pctx.fillRect(W/2*sc,0,pw,ph);
  } else {
    pctx.fillStyle='rgba(20,20,30,0.7)';
    pctx.fillRect(0,0,W/2*sc,ph);
  }

  // Formation row indicators
  const hqX = (pcfg.hq[0]*CELL+CELL/2)*sc;
  const hqY = (pcfg.hq[1]*CELL+CELL/2)*sc;
  const frontDir = isPlayerLeft ? 1 : -1;
  const offsets = {front:3*CELL*sc*frontDir, mid:0, back:-2*CELL*sc*frontDir};
  const colors = {front:'#ef4444',mid:'#f59e0b',back:'#3b82f6'};
  for(const[row,ox] of Object.entries(offsets)){
    const counts = formationUnitList.filter((_,i)=>formationAssignments[i]===row).length;
    if(counts>0){
      pctx.fillStyle=colors[row];
      pctx.globalAlpha=0.3;
      pctx.fillRect(hqX+ox-CELL*0.3*sc, hqY-CELL*2*sc, CELL*0.6*sc, CELL*4*sc);
      pctx.globalAlpha=1;
    }
  }
}

function confirmFormation(){
  phase='combat';
  startCombat(pendingSpawnConfigs, formationUnitList, formationAssignments);
}

// ===== CLASSES =====
class Unit {
  constructor(type,team,gx,gy){
    const def=UNIT_DEFS[type];
    this.type=type;this.team=team;
    this.hp=def.hp;this.maxHp=def.hp;this.atk=def.atk;this.range=def.range;
    this.speed=def.speed;this.atkSpeed=def.atkSpeed;this.counter=def.counter;
    this.x=gx*CELL+CELL/2;this.y=gy*CELL+CELL/2;
    this.atkCooldown=0;this.alive=true;this.target=null;
    this.retreating=false;this.deathTimer=0;this.flashTimer=0;
    this.formationRow=null;
    this.command=null; // per-unit command {type:'move'|'focus', x?, y?, target?}
    this.idle=true;
  }
  get gx(){return Math.floor(this.x/CELL);}
  get gy(){return Math.floor(this.y/CELL);}
}

class Building {
  constructor(type,team,gx,gy){
    this.type=type;this.team=team;this.gx=gx;this.gy=gy;
    this.x=gx*CELL+CELL/2;this.y=gy*CELL+CELL/2;
    this.alive=true;this.flashTimer=0;
    if(type==='hq'){this.hp=600;this.maxHp=600;this.atk=0;this.range=0;this.atkCooldown=0;}
    else{this.hp=250;this.maxHp=250;this.atk=18;this.range=6;this.atkCooldown=0;this.atkSpeed=2.5;}
  }
  get id(){return this.team+'_'+this.type+'_'+this.gx+'_'+this.gy;}
}

// ===== OBSTACLES =====
function initObstacles(){
  obstacles=[];obstacleSet=new Set();
  // DEEP-005: Collect all spawn point cells (HQ + towers) to exclude from obstacles
  const spawnCells=new Set();
  for(const side of ['left','right']){
    for(const cfg of SPAWN_CONFIGS[side]){
      spawnCells.add(cfg.hq[0]+','+cfg.hq[1]);
      for(const t of cfg.towers) spawnCells.add(t[0]+','+t[1]);
    }
  }
  // Symmetric 21x21 layout — skip any cell that overlaps a spawn point
  const blocks=[
    [10,8],[10,12],[8,10],[12,10], // central cross
    [4,4],[5,4],[4,5],             // top-left cluster
    [16,4],[15,4],[16,5],          // top-right
    [4,16],[5,16],[4,15],          // bottom-left
    [16,16],[15,16],[16,15],       // bottom-right
    [10,3],[10,17],[3,10],[17,10]  // mid-edges
  ];
  for(const[gx,gy]of blocks){
    const key=gx+','+gy;
    if(!spawnCells.has(key)){obstacles.push({gx,gy});obstacleSet.add(key);}
  }
}
function isObstacle(gx,gy){return obstacleSet.has(gx+','+gy);}
function isObstacleAt(x,y){return isObstacle(Math.floor(x/CELL),Math.floor(y/CELL));}
function hasLineOfSight(x1,y1,x2,y2){
  const d=Math.hypot(x2-x1,y2-y1);const steps=Math.ceil(d/(CELL*0.5));
  for(let i=1;i<steps;i++){const t=i/steps;if(isObstacleAt(x1+(x2-x1)*t,y1+(y2-y1)*t))return false;}
  return true;
}

// ===== SPAWN =====
function pickSpawnConfigs(){
  const pIdx=Math.floor(Math.random()*3);
  const eIdx=Math.floor(Math.random()*3);
  return {player:SPAWN_CONFIGS.left[pIdx], enemy:SPAWN_CONFIGS.right[eIdx]};
}

// ===== COMBAT INIT =====
function startCombat(spawnConfigs, unitList, formAssign){
  showScreen('combat-screen');
  phase='combat';

  // Size canvas to viewport
  const hud=$('combat-hud');
  const availH=window.innerHeight-hud.offsetHeight;
  const availW=window.innerWidth;
  const scale=Math.min(availW/VPW, availH/VPH);
  canvasScale=scale;
  canvas.width=VPW;canvas.height=VPH;
  canvas.style.width=Math.floor(VPW*scale)+'px';
  canvas.style.height=Math.floor(VPH*scale)+'px';
  canvas.style.margin='0 auto';

  units=[];buildings=[];projectiles=[];particles=[];
  battleTimer=BATTLE_TIME;
  advisorTimer=10+Math.random()*5;advisorActive=false;
  selectedTarget=null;selectedUnits=[];moveCursor=null;
  tacticalPriority=null;
  $('advisor-panel').classList.remove('show');

  // Obstacles (may already be init'd from formation preview)
  if(obstacles.length===0) initObstacles();

  // Place buildings from spawn configs
  const pcfg=spawnConfigs.player, ecfg=spawnConfigs.enemy;
  buildings.push(new Building('hq','player',pcfg.hq[0],pcfg.hq[1]));
  for(const t of pcfg.towers) buildings.push(new Building('tower','player',t[0],t[1]));
  buildings.push(new Building('hq','enemy',ecfg.hq[0],ecfg.hq[1]));
  for(const t of ecfg.towers) buildings.push(new Building('tower','enemy',t[0],t[1]));

  // Place player units by formation
  const playerHQ=buildings.find(b=>b.type==='hq'&&b.team==='player');
  const playerPositions=computeFormationPositions(playerHQ, unitList, formAssign, true);
  unitList.forEach((type,i)=>{
    const pos=playerPositions[i];
    const u=new Unit(type,'player',0,0);
    u.x=pos.x;u.y=pos.y;u.formationRow=formAssign[i];u.idle=true;
    units.push(u);
  });

  // Enemy AI composition + placement
  const enemyComp=aiPickComposition();
  const enemyUnitList=[];
  const enemyFormAssign={};
  const rowMap={infantry:'front',cavalry:'mid',archer:'back'};
  for(const[type,count]of Object.entries(enemyComp)){
    for(let i=0;i<count;i++){enemyUnitList.push(type);}
  }
  enemyUnitList.forEach((type,i)=>{enemyFormAssign[i]=rowMap[type]||'mid';});

  const enemyHQ=buildings.find(b=>b.type==='hq'&&b.team==='enemy');
  const enemyPositions=computeFormationPositions(enemyHQ, enemyUnitList, enemyFormAssign, false);
  enemyUnitList.forEach((type,i)=>{
    const pos=enemyPositions[i];
    const u=new Unit(type,'enemy',0,0);
    u.x=pos.x;u.y=pos.y;u.formationRow=enemyFormAssign[i];u.idle=false;
    units.push(u);
  });

  // Camera: center on player HQ
  cameraX=playerHQ.x-VPW/2;cameraY=playerHQ.y-VPH/2;clampCamera();

  // Fog
  initFog();

  lastTime=performance.now();
  gameLoop(lastTime);
}

function computeFormationPositions(hq, unitList, formAssign, isPlayerLeft){
  const positions={};
  const frontDir=isPlayerLeft?1:-1;
  const rowOffsets={front:3, mid:1.5, back:-2};

  // Group by row
  const rows={front:[],mid:[],back:[]};
  unitList.forEach((_,i)=>rows[formAssign[i]].push(i));

  for(const[row,indices]of Object.entries(rows)){
    const count=indices.length;
    const offsetX=rowOffsets[row]*CELL*frontDir;
    const spacing=CELL*1.2;
    const startY=hq.y-(count-1)*spacing/2;
    indices.forEach((idx,j)=>{
      positions[idx]={x:hq.x+offsetX, y:startY+j*spacing};
    });
  }
  return positions;
}

function aiPickComposition(){
  const comp={infantry:0,archer:0,cavalry:0};
  const types=Object.keys(UNIT_DEFS);
  let maxType='infantry',maxCount=0;
  for(const[t,c]of Object.entries(selected)){if(c>maxCount){maxCount=c;maxType=t;}}
  const counterType=Object.entries(UNIT_DEFS).find(([k,v])=>v.counter===maxType)?.[0]||'infantry';
  comp[counterType]=3+Math.floor(Math.random()*2);
  const remaining=MAX_UNITS-comp[counterType];
  for(let i=0;i<remaining;i++){comp[types[Math.floor(Math.random()*types.length)]]++;}
  return comp;
}

// ===== FOG =====
function generateCloudTexture(){
  const size=256;
  const off=document.createElement('canvas');off.width=size;off.height=size;
  const oCtx=off.getContext('2d');
  const imgData=oCtx.createImageData(size,size);const d=imgData.data;
  const gs1=16,gs2=32;
  const n1=Array.from({length:(gs1+1)*(gs1+1)},()=>Math.random());
  const n2=Array.from({length:(gs2+1)*(gs2+1)},()=>Math.random());
  for(let y=0;y<size;y++){for(let x=0;x<size;x++){
    const gx1=x/size*gs1,gy1=y/size*gs1,ix1=Math.floor(gx1),iy1=Math.floor(gy1);
    const fx1=gx1-ix1,fy1=gy1-iy1,sfx1=fx1*fx1*(3-2*fx1),sfy1=fy1*fy1*(3-2*fy1);
    const s1=gs1+1;
    const v1=n1[iy1*s1+ix1]*(1-sfx1)*(1-sfy1)+n1[iy1*s1+ix1+1]*sfx1*(1-sfy1)+n1[(iy1+1)*s1+ix1]*(1-sfx1)*sfy1+n1[(iy1+1)*s1+ix1+1]*sfx1*sfy1;
    const gx2=x/size*gs2,gy2=y/size*gs2,ix2=Math.floor(gx2),iy2=Math.floor(gy2);
    const fx2=gx2-ix2,fy2=gy2-iy2,sfx2=fx2*fx2*(3-2*fx2),sfy2=fy2*fy2*(3-2*fy2);
    const s2=gs2+1;
    const v2=n2[iy2*s2+ix2]*(1-sfx2)*(1-sfy2)+n2[iy2*s2+ix2+1]*sfx2*(1-sfy2)+n2[(iy2+1)*s2+ix2]*(1-sfx2)*sfy2+n2[(iy2+1)*s2+ix2+1]*sfx2*sfy2;
    const v=v1*0.65+v2*0.35;
    const idx=(y*size+x)*4;
    d[idx]=15+Math.floor(v*30);d[idx+1]=18+Math.floor(v*25);d[idx+2]=40+Math.floor(v*45);d[idx+3]=210+Math.floor(v*45);
  }}
  oCtx.putImageData(imgData,0,0);return off;
}

function initFog(){
  fogGrid=new Uint8Array(COLS*ROWS);
  exploredBuildings=new Map();visionTickTimer=0;
  cloudCanvas=generateCloudTexture();
  fogOverlayCanvas=document.createElement('canvas');fogOverlayCanvas.width=W;fogOverlayCanvas.height=H;
  fogOverlayCtx=fogOverlayCanvas.getContext('2d');
  // BUG-003: Reveal entire player half
  const playerSide=buildings.find(b=>b.team==='player'&&b.type==='hq');
  const isLeft=playerSide && playerSide.gx<COLS/2;
  const halfCol=isLeft?Math.ceil(COLS/2):Math.floor(COLS/2);
  for(let gx=isLeft?0:halfCol;gx<(isLeft?halfCol:COLS);gx++){
    for(let gy=0;gy<ROWS;gy++) fogGrid[gy*COLS+gx]=FOG_VISIBLE;
  }
  // BUG-004: Use same vision range as tick (no +2)
  for(const b of buildings){if(b.team==='player'&&b.alive) markDiamond(b.gx,b.gy,BUILDING_VISION_RANGE);}
  for(const u of units){if(u.team==='player'&&u.alive) markDiamond(u.gx,u.gy,Math.ceil(u.range+1));}
}

function markDiamond(cx,cy,range){
  for(let dx=-range;dx<=range;dx++){
    for(let dy=-(range-Math.abs(dx));dy<=(range-Math.abs(dx));dy++){
      const gx=cx+dx,gy=cy+dy;
      if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS) fogGrid[gy*COLS+gx]=FOG_VISIBLE;
    }
  }
}

function updateVision(){
  for(let i=0;i<fogGrid.length;i++){if(fogGrid[i]===FOG_VISIBLE)fogGrid[i]=FOG_EXPLORED;}
  for(const u of units){if(u.alive&&u.team==='player') markDiamond(u.gx,u.gy,Math.ceil(u.range+1));}
  for(const b of buildings){if(b.alive&&b.team==='player') markDiamond(b.gx,b.gy,BUILDING_VISION_RANGE);}
  // REG-003: Keep entire player half always visible every tick
  const playerHQ=buildings.find(b=>b.team==='player'&&b.type==='hq'&&b.alive);
  if(playerHQ){
    const isLeft=playerHQ.gx<COLS/2;
    const halfCol=isLeft?Math.ceil(COLS/2):Math.floor(COLS/2);
    for(let gx=isLeft?0:halfCol;gx<(isLeft?halfCol:COLS);gx++){
      for(let gy=0;gy<ROWS;gy++) fogGrid[gy*COLS+gx]=FOG_VISIBLE;
    }
  }
  // Track explored enemy buildings
  for(const b of buildings){
    if(b.team==='player'||!b.alive)continue;
    if(isCellVisible(b.gx,b.gy)){
      exploredBuildings.set(b.id,{type:b.type,gx:b.gx,gy:b.gy,x:b.x,y:b.y,hp:b.hp,maxHp:b.maxHp,team:b.team,visible:true});
    } else if(exploredBuildings.has(b.id)){exploredBuildings.get(b.id).visible=false;}
  }
}

function getFogCell(gx,gy){if(gx<0||gx>=COLS||gy<0||gy>=ROWS)return FOG_UNEXPLORED;return fogGrid[gy*COLS+gx];}
function isCellVisible(gx,gy){return getFogCell(gx,gy)===FOG_VISIBLE;}
function isCellExplored(gx,gy){const v=getFogCell(gx,gy);return v===FOG_VISIBLE||v===FOG_EXPLORED;}
function isEntityVisibleToPlayer(e){return isCellVisible(Math.floor(e.x/CELL),Math.floor(e.y/CELL));}
function isBuildingVisibleToPlayer(b){return isCellVisible(b.gx,b.gy);}
function isBuildingExplored(b){return exploredBuildings.has(b.id)&&isCellExplored(b.gx,b.gy);}

// ===== GAME LOOP =====
function gameLoop(now){
  const dt=Math.min((now-lastTime)/1000,0.1);lastTime=now;
  if(phase!=='combat')return;
  battleTimer-=dt;updateTimer();
  visionTickTimer+=dt;
  if(visionTickTimer>=FOG_TICK_INTERVAL){visionTickTimer-=FOG_TICK_INTERVAL;updateVision();}
  updateCamera(dt);
  updateUnits(dt);updateBuildings(dt);updateProjectiles(dt);updateParticles(dt);
  updateAdvisor(dt);updateMoveCursor(dt);
  checkWinCondition();
  render();
  animId=requestAnimationFrame(gameLoop);
}

function updateTimer(){
  const t=Math.max(0,Math.ceil(battleTimer));
  $('timer').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}

// ===== TARGETING =====
function findNearestEnemy(unit){
  let best=null,bestD=Infinity;
  for(const e of units){if(!e.alive||e.team===unit.team)continue;const d=dist(unit,e);if(d<bestD){bestD=d;best=e;}}
  for(const b of buildings){if(!b.alive||b.team===unit.team)continue;if(b.type==='tower'&&!hasLineOfSight(b.x,b.y,unit.x,unit.y))continue;const d=dist(unit,b);if(d<bestD){bestD=d;best=b;}}
  return best;
}

function findNearestVisibleEnemy(unit){
  let best=null,bestD=Infinity;
  for(const e of units){if(!e.alive||e.team===unit.team||!isEntityVisibleToPlayer(e))continue;const d=dist(unit,e);if(d<bestD){bestD=d;best=e;}}
  for(const b of buildings){if(!b.alive||b.team===unit.team||!isBuildingVisibleToPlayer(b))continue;const d=dist(unit,b);if(d<bestD){bestD=d;best=b;}}
  return best;
}

function findPriorityTarget(unit){
  // Manual target override
  if(unit.command && unit.command.type==='focus' && unit.command.target && unit.command.target.alive){
    if(unit.team==='enemy'||isEntityVisibleToPlayer(unit.command.target)) return unit.command.target;
  }
  // Tactical priority
  const enemies=units.filter(u=>u.alive&&u.team!==unit.team);
  if(tacticalPriority && unit.team==='player'){
    const order = tacticalPriority==='back' ? ['back','mid','front'] : ['front','mid','back'];
    for(const row of order){
      const inRow=enemies.filter(e=>isEntityVisibleToPlayer(e)&&e.formationRow===row);
      if(inRow.length>0){
        let best=null,bestD=Infinity;
        for(const e of inRow){const d=dist(unit,e);if(d<bestD){bestD=d;best=e;}}
        return best;
      }
    }
  }
  // Default: nearest visible
  return findNearestVisibleEnemy(unit);
}

// ===== UNIT AI =====
function updateUnits(dt){
  for(const u of units){
    if(!u.alive){u.deathTimer-=dt;continue;}
    u.atkCooldown=Math.max(0,u.atkCooldown-dt);
    u.flashTimer=Math.max(0,u.flashTimer-dt);

    // Retreating
    // BUG-002: Focus command overrides retreat
    if(u.retreating && u.command && u.command.type==='focus' && u.command.target && u.command.target.alive){
      u.retreating=false;
    }
    if(u.retreating){
      const hq=buildings.find(b=>b.type==='hq'&&b.team===u.team&&b.alive);
      if(hq)moveToward(u,hq.x,hq.y,dt);
      // BUG-001: Passive HP recovery while retreating near HQ
      const healRate=u.maxHp*0.15; // 15% maxHP per second
      u.hp=Math.min(u.maxHp, u.hp + healRate*dt);
      if(u.hp>=u.maxHp)u.retreating=false;
      continue;
    }

    // Enemy auto-retreat
    if(u.team==='enemy'&&u.hp<u.maxHp*0.2){u.retreating=true;u.target=null;continue;}

    // Player units
    if(u.team==='player'){
      if(u.command){
        if(u.command.type==='move'){
          moveToward(u,u.command.x,u.command.y,dt);
          if(moveCursor&&dist(u,{x:u.command.x,y:u.command.y})<CELL*2)moveCursor=null;
          const arrived=dist(u,{x:u.command.x,y:u.command.y})<CELL*1;
          if(arrived){
            u.command=null;u.idle=false;
            // Auto-engage visible enemies in range
            const near=findNearestVisibleEnemy(u);
            if(near&&cellDist(u,near)<=u.range&&u.atkCooldown<=0){
              if(u.range<=2||hasLineOfSight(u.x,u.y,near.x,near.y)){
                u.target=near;attackTarget(u,near);u.atkCooldown=u.atkSpeed;
              }
            }
          }
        } else if(u.command.type==='focus'&&u.command.target&&u.command.target.alive){
          const t=u.command.target;
          const visible=t.team==='player'||isEntityVisibleToPlayer(t);
          if(!visible){u.command=null;u.target=null;u.idle=true;continue;}
          u.target=t;
          const d=cellDist(u,t);
          if(d<=u.range){
            moveToAttackSlot(u,t,dt);
            if(u.atkCooldown<=0){
              if(u.range>2&&!hasLineOfSight(u.x,u.y,t.x,t.y)){moveToward(u,t.x,t.y,dt);}
              else{attackTarget(u,t);u.atkCooldown=u.atkSpeed;}
            }
          } else {moveToward(u,t.x,t.y,dt);}
        } else {u.command=null;u.idle=true;}
      } else if(!u.idle && u.target && u.target.alive){
        // Continuing combat from auto-engage
        const visible=u.target.team==='player'||isEntityVisibleToPlayer(u.target);
        if(!visible){u.target=null;u.idle=true;continue;}
        const d=cellDist(u,u.target);
        if(d<=u.range){
          moveToAttackSlot(u,u.target,dt);
          if(u.atkCooldown<=0){
            if(u.range>2&&!hasLineOfSight(u.x,u.y,u.target.x,u.target.y)){moveToward(u,u.target.x,u.target.y,dt);}
            else{attackTarget(u,u.target);u.atkCooldown=u.atkSpeed;}
          }
        } else {moveToward(u,u.target.x,u.target.y,dt);}
      } else if(!u.idle && (!u.target||!u.target.alive)){
        // BUG-005: Target lost → idle, don't auto-switch
        u.idle=true;u.target=null;
      }
      // idle: do nothing
      continue;
    }

    // Enemy AI (god view)
    if(!u.target||!u.target.alive) u.target=findNearestEnemy(u);
    if(u.target){
      const d=cellDist(u,u.target);
      if(d<=u.range){
        moveToAttackSlot(u,u.target,dt);
        if(u.atkCooldown<=0){
          if(u.range>2&&!hasLineOfSight(u.x,u.y,u.target.x,u.target.y)){moveToward(u,u.target.x,u.target.y,dt);}
          else{attackTarget(u,u.target);u.atkCooldown=u.atkSpeed;}
        }
      } else {moveToward(u,u.target.x,u.target.y,dt);}
    }
  }

  // Remove dead
  units=units.filter(u=>u.alive||u.deathTimer>0);

  // Separation
  for(let i=0;i<units.length;i++){
    if(!units[i].alive)continue;
    for(let j=i+1;j<units.length;j++){
      if(!units[j].alive)continue;
      const a=units[i],b=units[j];const d=dist(a,b);const minD=CELL*0.6;
      if(d<minD&&d>0){const push=(minD-d)*0.3;const dx=(a.x-b.x)/d,dy=(a.y-b.y)/d;
        a.x+=dx*push;a.y+=dy*push;b.x-=dx*push;b.y-=dy*push;}
    }
  }
}

function moveToAttackSlot(u,target,dt){
  const attackers=units.filter(o=>o.alive&&o.team===u.team&&o.target===target);
  const count=attackers.length;if(count<=1)return;
  const idx=attackers.indexOf(u);
  const angle=(Math.PI*2/count)*idx;
  const r=u.range*CELL*0.85;
  const sx=target.x+Math.cos(angle)*r, sy=target.y+Math.sin(angle)*r;
  if(Math.hypot(u.x-sx,u.y-sy)>CELL*0.3) moveToward(u,sx,sy,dt);
}

function moveToward(u,tx,ty,dt){
  const dx=tx-u.x,dy=ty-u.y;const d=Math.hypot(dx,dy);if(d<2)return;
  let dirX=dx/d,dirY=dy/d;const step=u.speed*CELL*dt;
  const la=CELL*0.8;const nx=u.x+dirX*la,ny=u.y+dirY*la;
  if(isObstacleAt(nx,ny)){
    const px=-dirY,py=dirX;
    const a1x=u.x+(dirX*0.5+px)*la,a1y=u.y+(dirY*0.5+py)*la;
    const a2x=u.x+(dirX*0.5-px)*la,a2y=u.y+(dirY*0.5-py)*la;
    const b1=isObstacleAt(a1x,a1y),b2=isObstacleAt(a2x,a2y);
    if(!b1&&(b2||Math.random()>0.5)){dirX=dirX*0.5+px;dirY=dirY*0.5+py;}
    else if(!b2){dirX=dirX*0.5-px;dirY=dirY*0.5-py;}
    else {
      // NEW-001: Both lateral probes blocked — try full perpendicular directions (90° turn)
      const p1x=u.x+px*la,p1y=u.y+py*la;
      const p2x=u.x-px*la,p2y=u.y-py*la;
      if(!isObstacleAt(p1x,p1y)){dirX=px;dirY=py;}
      else if(!isObstacleAt(p2x,p2y)){dirX=-px;dirY=-py;}
      else {
        // NEW-002: All directions blocked — try backing up slightly then re-probing
        const backX=u.x-dirX*CELL*0.5,backY=u.y-dirY*CELL*0.5;
        if(!isObstacleAt(backX,backY)){
          // Move backward to create space, then try perpendicular again
          u.x=backX;u.y=backY;
          const bp1x=backX+px*la*1.5,bp1y=backY+py*la*1.5;
          const bp2x=backX-px*la*1.5,bp2y=backY-py*la*1.5;
          if(!isObstacleAt(bp1x,bp1y)){dirX=px;dirY=py;}
          else if(!isObstacleAt(bp2x,bp2y)){dirX=-px;dirY=-py;}
          else {dirX=px;dirY=py;} // Force perpendicular as last resort
        } else {
          // Truly trapped — force perpendicular movement anyway (may squeeze through gaps)
          dirX=px;dirY=py;
        }
      }
    }
    const nd=Math.hypot(dirX,dirY);if(nd>0){dirX/=nd;dirY/=nd;}
  }
  const newX=u.x+dirX*Math.min(step,d),newY=u.y+dirY*Math.min(step,d);
  if(!isObstacleAt(newX,newY)){u.x=newX;u.y=newY;}
  else{
    // NEW-003: If diagonal move blocked, try axis-aligned with obstacle avoidance
    const stepX=dirX*Math.min(step,d),stepY=dirY*Math.min(step,d);
    if(!isObstacleAt(u.x+stepX,u.y)){u.x+=stepX;}
    else if(!isObstacleAt(u.x,u.y+stepY)){u.y+=stepY;}
    else {
      // NEW-004: Both axes blocked — try perpendicular sliding
      const px=-dirY,py=dirX;
      const perpStep=u.speed*CELL*dt*0.7;
      if(!isObstacleAt(u.x+px*perpStep,u.y+py*perpStep)){
        u.x+=px*perpStep;u.y+=py*perpStep;
      } else if(!isObstacleAt(u.x-px*perpStep,u.y-py*perpStep)){
        u.x-=px*perpStep;u.y-=py*perpStep;
      }
      // else: truly stuck, unit will wait for separation or obstacle clearance
    }
  }
  u.x=clamp(u.x,CELL/2,W-CELL/2);u.y=clamp(u.y,CELL/2,H-CELL/2);
}

function attackTarget(attacker,target){
  let dmg=attacker.atk;
  if(target.type&&attacker.counter===target.type)dmg=Math.floor(dmg*COUNTER_BONUS);
  if(attacker.range>2){projectiles.push({x:attacker.x,y:attacker.y,tx:target.x,ty:target.y,target,dmg,speed:300,team:attacker.team});}
  else{applyDamage(target,dmg);}
}

function applyDamage(target,dmg){
  target.hp-=dmg;target.flashTimer=0.15;
  const oy=target.type==='hq'?-CELL*1.2:target.type==='tower'?-CELL*0.9:-CELL*0.7;
  spawnDmgNumber(target.x+(Math.random()-0.5)*CELL*0.4,target.y+oy,dmg,target.team==='player'?'#ef4444':'#22c55e');
  for(let i=0;i<3;i++)particles.push({x:target.x,y:target.y,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80-30,life:0.4,color:target.team==='player'?'#3b82f6':'#ef4444',size:3});
  if(target.hp<=0){
    target.hp=0;target.alive=false;if(target.deathTimer!==undefined)target.deathTimer=0.5;
    for(let i=0;i<8;i++)particles.push({x:target.x,y:target.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,life:0.6,color:'#f59e0b',size:4});
    if(selectedTarget&&selectedTarget.entity===target)selectedTarget=null;
    selectedUnits=selectedUnits.filter(u=>u!==target);
    if(target.id)exploredBuildings.delete(target.id);
  }
  updateHQBars();
}

function updateHQBars(){
  const ph=buildings.find(b=>b.type==='hq'&&b.team==='player');
  const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy');
  if(ph)$('player-hq-hp').style.width=(ph.hp/ph.maxHp*100)+'%';
  if(eh&&isBuildingVisibleToPlayer(eh))$('enemy-hq-hp').style.width=(eh.hp/eh.maxHp*100)+'%';
}

function spawnDmgNumber(wx,wy,dmg,color){
  const rect=canvas.getBoundingClientRect();
  const sx=rect.left+(wx-cameraX)*canvasScale;
  const sy=rect.top+(wy-cameraY)*canvasScale;
  const el=document.createElement('div');el.className='dmg-num';
  el.style.left=sx+'px';el.style.top=sy+'px';el.style.color=color;el.textContent='-'+dmg;
  $('combat-screen').appendChild(el);setTimeout(()=>el.remove(),800);
}

// ===== BUILDINGS =====
function updateBuildings(dt){
  for(const b of buildings){
    if(!b.alive)continue;b.flashTimer=Math.max(0,b.flashTimer-dt);
    if(b.atk<=0)continue;b.atkCooldown=Math.max(0,b.atkCooldown-dt);if(b.atkCooldown>0)continue;
    const enemies=units.filter(u=>u.alive&&u.team!==b.team);
    let best=null,bestD=Infinity;
    for(const e of enemies){
      if(b.team==='player'&&!isEntityVisibleToPlayer(e))continue;
      const d=cellDist(b,e);
      if(d<bestD&&d<=b.range&&hasLineOfSight(b.x,b.y,e.x,e.y)){bestD=d;best=e;}
    }
    if(best){projectiles.push({x:b.x,y:b.y,tx:best.x,ty:best.y,target:best,dmg:b.atk,speed:250,team:b.team});b.atkCooldown=b.atkSpeed;}
  }
}

function updateProjectiles(dt){
  for(const p of projectiles){
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),step=p.speed*dt;
    if(d<step+5){if(p.target&&p.target.alive)applyDamage(p.target,p.dmg);p.done=true;}
    else{p.x+=(dx/d)*step;p.y+=(dy/d)*step;if(p.target&&p.target.alive){p.tx=p.target.x;p.ty=p.target.y;}}
  }
  projectiles=projectiles.filter(p=>!p.done);
}

function updateParticles(dt){
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}
  particles=particles.filter(p=>p.life>0);
}

function updateMoveCursor(dt){if(moveCursor){moveCursor.timer-=dt;if(moveCursor.timer<=0)moveCursor=null;}}

// ===== ADVISOR =====
const ADVICE=[
  {cond:()=>units.filter(u=>u.alive&&u.team==='enemy'&&u.type==='cavalry').length>=2,msg:'敌方骑兵压力较大，建议集中步兵拦截！',action:'focusCavalry'},
  {cond:()=>units.filter(u=>u.alive&&u.team==='enemy'&&u.type==='archer').length>=2,msg:'敌方射手火力密集，建议派骑兵突袭！',action:'focusArcher'},
  {cond:()=>units.filter(u=>u.alive&&u.team==='player'&&u.hp<u.maxHp*0.3).length>=2,msg:'多个单位血量告急，建议撤退重组！',action:'retreatLow'},
  {cond:()=>{const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy');return eh&&eh.hp<eh.maxHp*0.5;},msg:'敌方主堡受损严重，全力进攻！',action:'pushHQ'},
  {cond:()=>true,msg:'战场局势胶着，注意兵种克制关系。',action:null},
];

function updateAdvisor(dt){
  if(advisorActive)return;advisorTimer-=dt;
  if(advisorTimer<=0){advisorTimer=15+Math.random()*10;const a=ADVICE.find(a=>a.cond())||ADVICE[ADVICE.length-1];showAdvisor(a.msg,a.action);}
}
function showAdvisor(msg,action){advisorActive=true;advisorAction=action;$('advisor-msg').textContent=msg;$('advisor-panel').classList.add('show');}
function acceptAdvice(){
  const targets = selectedUnits.length>0 ? selectedUnits : units.filter(u=>u.alive&&u.team==='player');
  if(advisorAction==='focusCavalry'){const ec=units.find(u=>u.alive&&u.team==='enemy'&&u.type==='cavalry');if(ec){targets.forEach(u=>{u.command={type:'focus',target:ec};u.idle=false;});selectedTarget={entity:ec,glowColor:'#ef4444'};}}
  else if(advisorAction==='focusArcher'){const ea=units.find(u=>u.alive&&u.team==='enemy'&&u.type==='archer');if(ea){targets.forEach(u=>{u.command={type:'focus',target:ea};u.idle=false;});selectedTarget={entity:ea,glowColor:'#ef4444'};}}
  else if(advisorAction==='retreatLow'){units.filter(u=>u.alive&&u.team==='player'&&u.hp<u.maxHp*0.3).forEach(u=>u.retreating=true);}
  else if(advisorAction==='pushHQ'){const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy'&&b.alive);if(eh){targets.forEach(u=>{u.command={type:'move',x:eh.x,y:eh.y};u.idle=false;});moveCursor={x:eh.x,y:eh.y,timer:3};}}
  dismissAdvisor();
}
function dismissAdvisor(){advisorActive=false;$('advisor-panel').classList.remove('show');}

// ===== WIN =====
function checkWinCondition(){
  const ph=buildings.find(b=>b.type==='hq'&&b.team==='player');
  const eh=buildings.find(b=>b.type==='hq'&&b.team==='enemy');
  if(eh&&!eh.alive){endGame('win');return;}
  if(ph&&!ph.alive){endGame('lose');return;}
  if(battleTimer<=0){const pp=calcPower('player'),ep=calcPower('enemy');if(pp>ep)endGame('win');else if(ep>pp)endGame('lose');else endGame('draw');}
}
function calcPower(team){
  let p=0;const hq=buildings.find(b=>b.type==='hq'&&b.team===team);
  if(hq&&hq.alive)p+=hq.hp;
  units.filter(u=>u.alive&&u.team===team).forEach(u=>p+=u.hp);
  buildings.filter(b=>b.alive&&b.team===team&&b.type==='tower').forEach(b=>p+=b.hp);
  return p;
}
function endGame(result){
  phase='result';if(animId)cancelAnimationFrame(animId);
  const t=$('result-title');
  if(result==='win'){t.textContent='胜 利';t.className='win';}
  else if(result==='lose'){t.textContent='战 败';t.className='lose';}
  else{t.textContent='平 局';t.className='draw';}
  const pA=units.filter(u=>u.team==='player'&&u.alive).length;
  const eL=MAX_UNITS-units.filter(u=>u.team==='enemy'&&u.alive).length;
  const timeUsed=BATTLE_TIME-Math.max(0,Math.ceil(battleTimer));
  $('result-stats').innerHTML=`<div>⏱ 用时: ${Math.floor(timeUsed/60)}分${timeUsed%60}秒</div><div>🔵 我方损失: ${MAX_UNITS-pA}</div><div>🔴 敌方损失: ${eL}</div><div>🔵 我方剩余: ${calcPower('player')}</div><div>🔴 敌方剩余: ${calcPower('enemy')}</div>`;
  showScreen('result-screen');
}

// ===== RENDERING =====
function render(){
  ctx.clearRect(0,0,VPW,VPH);
  ctx.save();
  ctx.translate(-cameraX,-cameraY);

  drawGrid();drawObstacles();
  drawPlayerBuildings();drawPlayerUnits();
  drawVisibleEnemyBuildings();drawVisibleEnemyUnits();
  drawProjectiles();drawParticles();
  drawFogOverlay();drawBuildingShadows();
  drawSelectionGlow();drawMoveCursor();drawDeathSkulls();
  drawSelectionRect();

  ctx.restore();
  drawMinimap();
}

function drawGrid(){
  ctx.strokeStyle='#151d30';ctx.lineWidth=1;
  const sc=Math.floor(cameraX/CELL),ec=Math.min(COLS,Math.ceil((cameraX+VPW)/CELL));
  const sr=Math.floor(cameraY/CELL),er=Math.min(ROWS,Math.ceil((cameraY+VPH)/CELL));
  for(let x=sc;x<=ec;x++){ctx.beginPath();ctx.moveTo(x*CELL,cameraY);ctx.lineTo(x*CELL,cameraY+VPH);ctx.stroke();}
  for(let y=sr;y<=er;y++){ctx.beginPath();ctx.moveTo(cameraX,y*CELL);ctx.lineTo(cameraX+VPW,y*CELL);ctx.stroke();}
  // Territory tint
  ctx.fillStyle='rgba(59,130,246,0.03)';ctx.fillRect(0,0,W/2,H);
  ctx.fillStyle='rgba(239,68,68,0.03)';ctx.fillRect(W/2,0,W/2,H);
}

function drawObstacles(){
  for(const obs of obstacles){
    const x=obs.gx*CELL,y=obs.gy*CELL;
    ctx.fillStyle='#1a2035';ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
    ctx.strokeStyle='#2a3550';ctx.lineWidth=1;ctx.strokeRect(x+2,y+2,CELL-4,CELL-4);
    ctx.fillStyle='#232d45';ctx.fillRect(x+8,y+8,CELL-16,CELL-16);
    ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#3a4a6a';ctx.fillText('🪨',x+CELL/2,y+CELL/2);
  }
}

function drawPlayerBuildings(){for(const b of buildings){if(!b.alive||b.team!=='player')continue;drawBuilding(b,false);}}
function drawVisibleEnemyBuildings(){for(const b of buildings){if(!b.alive||b.team==='player'||!isBuildingVisibleToPlayer(b))continue;drawBuilding(b,false);}}

function drawBuilding(b,asShadow){
  const isPlayer=b.team==='player';const color=isPlayer?'#3b82f6':'#ef4444';
  if(asShadow){
    ctx.save();ctx.globalAlpha=0.4;
    if(b.type==='hq'){
      ctx.fillStyle='#555';ctx.globalAlpha=0.15;ctx.fillRect(b.x-CELL,b.y-CELL,CELL*2,CELL*2);
      ctx.globalAlpha=0.4;ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.strokeRect(b.x-CELL,b.y-CELL,CELL*2,CELL*2);
      ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#888';ctx.fillText('🏰',b.x,b.y);
    } else {
      ctx.fillStyle='#555';ctx.globalAlpha=0.15;ctx.beginPath();ctx.arc(b.x,b.y,CELL*0.6,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.4;ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,CELL*0.6,0,Math.PI*2);ctx.stroke();
      ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#888';ctx.fillText('🗼',b.x,b.y);
    }
    ctx.restore();return;
  }
  if(b.flashTimer>0){ctx.fillStyle='#fff';ctx.globalAlpha=0.5;ctx.fillRect(b.x-CELL*.8,b.y-CELL*.8,CELL*1.6,CELL*1.6);ctx.globalAlpha=1;}
  if(b.type==='hq'){
    ctx.fillStyle=color;ctx.globalAlpha=0.25;ctx.fillRect(b.x-CELL,b.y-CELL,CELL*2,CELL*2);ctx.globalAlpha=1;
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.strokeRect(b.x-CELL,b.y-CELL,CELL*2,CELL*2);
    for(let i=0;i<4;i++){ctx.fillStyle=color;ctx.fillRect(b.x-CELL+i*20+2,b.y-CELL-6,10,8);}
    ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🏰',b.x,b.y);
    drawHPBar(b.x-CELL,b.y+CELL+4,CELL*2,5,b.hp,b.maxHp,color);
  } else {
    ctx.fillStyle=color;ctx.globalAlpha=0.2;ctx.beginPath();ctx.arc(b.x,b.y,CELL*0.6,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,CELL*0.6,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle=color;ctx.lineWidth=0.5;ctx.globalAlpha=0.15;ctx.beginPath();ctx.arc(b.x,b.y,b.range*CELL,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;
    ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🗼',b.x,b.y);
    drawHPBar(b.x-15,b.y+CELL*0.7,30,4,b.hp,b.maxHp,color);
  }
}

function drawPlayerUnits(){for(const u of units){if(!u.alive||u.team!=='player')continue;drawUnit(u);}}
function drawVisibleEnemyUnits(){for(const u of units){if(!u.alive||u.team==='player'||!isEntityVisibleToPlayer(u))continue;drawUnit(u);}}

function drawUnit(u){
  const def=UNIT_DEFS[u.type];const isPlayer=u.team==='player';const baseColor=isPlayer?def.color:def.eColor;
  if(u.flashTimer>0){ctx.fillStyle='#fff';ctx.globalAlpha=0.6;ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.45,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  if(u.retreating){ctx.strokeStyle='#22c55e';ctx.lineWidth=1;ctx.globalAlpha=0.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
  ctx.fillStyle=baseColor;ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle=baseColor;ctx.lineWidth=2;ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.4,0,Math.PI*2);ctx.stroke();
  ctx.font='18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(def.icon,u.x,u.y);
  drawHPBar(u.x-14,u.y-CELL*0.5,28,3,u.hp,u.maxHp,baseColor);
  ctx.fillStyle=isPlayer?'#3b82f6':'#ef4444';ctx.beginPath();ctx.arc(u.x,u.y+CELL*0.35,3,0,Math.PI*2);ctx.fill();
}

function drawDeathSkulls(){
  for(const u of units){if(u.alive||u.deathTimer<=0)continue;
    if(u.team==='enemy'&&!isEntityVisibleToPlayer(u))continue;
    ctx.globalAlpha=u.deathTimer*2;ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💀',u.x,u.y);ctx.globalAlpha=1;}
}

function drawHPBar(x,y,w,h,hp,maxHp,color){
  ctx.fillStyle='#1e293b';ctx.fillRect(x,y,w,h);
  const pct=Math.max(0,hp/maxHp);ctx.fillStyle=pct>0.5?color:pct>0.25?'#f59e0b':'#ef4444';ctx.fillRect(x,y,w*pct,h);
}

function drawProjectiles(){
  for(const p of projectiles){
    ctx.fillStyle=p.team==='player'?'#60a5fa':'#fbbf24';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=p.team==='player'?'rgba(96,165,250,0.3)':'rgba(251,191,36,0.3)';ctx.lineWidth=2;
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
    if(d>1){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-(dx/d)*10,p.y-(dy/d)*10);ctx.stroke();}
  }
}

function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/0.6);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}ctx.globalAlpha=1;}

function drawFogOverlay(){
  if(!fogGrid||!cloudCanvas||!fogOverlayCtx)return;
  const fc=fogOverlayCtx;fc.clearRect(0,0,W,H);
  for(let gy=0;gy<ROWS;gy++){for(let gx=0;gx<COLS;gx++){
    const state=fogGrid[gy*COLS+gx];const px=gx*CELL,py=gy*CELL;
    if(state===FOG_UNEXPLORED){const sx=px%cloudCanvas.width,sy=py%cloudCanvas.height;fc.drawImage(cloudCanvas,sx,sy,CELL,CELL,px,py,CELL,CELL);}
    else if(state===FOG_EXPLORED){fc.fillStyle='rgba(20,20,30,0.7)';fc.fillRect(px,py,CELL,CELL);}
  }}
  ctx.drawImage(fogOverlayCanvas,0,0);
}

function drawBuildingShadows(){
  for(const[id,info]of exploredBuildings){
    const b=buildings.find(bb=>bb.id===id);if(!b||!b.alive)continue;
    if(isBuildingVisibleToPlayer(b))continue;if(!isCellExplored(b.gx,b.gy))continue;
    drawBuilding(b,true);
  }
}

function drawSelectionGlow(){
  // Yellow glow for selected friendly units
  const time=performance.now()/1000;const pulse=0.6+Math.sin(time*4)*0.2;
  for(const u of selectedUnits){
    if(!u.alive)continue;
    ctx.save();ctx.strokeStyle='#fbbf24';ctx.lineWidth=2.5;ctx.globalAlpha=pulse;ctx.shadowColor='#fbbf24';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(u.x,u.y,CELL*0.55,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  // Target glow
  if(!selectedTarget||!selectedTarget.entity||!selectedTarget.entity.alive){selectedTarget=null;return;}
  const e=selectedTarget.entity;
  if(e.team==='enemy'&&!isCellVisible(Math.floor(e.x/CELL),Math.floor(e.y/CELL))&&!isCellExplored(Math.floor(e.x/CELL),Math.floor(e.y/CELL))){selectedTarget=null;return;}
  ctx.save();ctx.strokeStyle=selectedTarget.glowColor;ctx.lineWidth=e.type==='hq'?4:2.5;ctx.globalAlpha=pulse;ctx.shadowColor=selectedTarget.glowColor;ctx.shadowBlur=15;
  if(e.type==='hq')ctx.strokeRect(e.x-CELL*1.1,e.y-CELL*1.1,CELL*2.2,CELL*2.2);
  else if(e.type==='tower'){ctx.beginPath();ctx.arc(e.x,e.y,CELL*0.75,0,Math.PI*2);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(e.x,e.y,CELL*0.55,0,Math.PI*2);ctx.stroke();}
  ctx.restore();
}

function drawSelectionRect(){
  if(!isDragging||!mouseDownPos)return;
  const w1=screenToWorld(dragScreenStartX,dragScreenStartY);
  const w2=screenToWorld(dragScreenCurX,dragScreenCurY);
  const rx=Math.min(w1.x,w2.x),ry=Math.min(w1.y,w2.y);
  const rw=Math.abs(w2.x-w1.x),rh=Math.abs(w2.y-w1.y);
  ctx.fillStyle='rgba(59,130,246,0.12)';ctx.fillRect(rx,ry,rw,rh);
  ctx.strokeStyle='rgba(59,130,246,0.6)';ctx.lineWidth=1.5;ctx.strokeRect(rx,ry,rw,rh);
}

function drawMoveCursor(){
  if(!moveCursor)return;
  ctx.save();ctx.globalAlpha=Math.min(1,moveCursor.timer*2);ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const pulse=1+Math.sin(performance.now()/200)*0.1;ctx.translate(moveCursor.x,moveCursor.y);ctx.scale(pulse,pulse);ctx.fillText('👆',0,0);ctx.restore();
}

// ===== MINIMAP =====
function drawMinimap(){
  const mx=VPW-MINIMAP_SIZE-MINIMAP_MARGIN, my=VPH-MINIMAP_SIZE-MINIMAP_MARGIN;
  ctx.fillStyle='#0a0e17';ctx.fillRect(mx-1,my-1,MINIMAP_SIZE+2,MINIMAP_SIZE+2);
  ctx.strokeStyle='#1e293b';ctx.lineWidth=1;ctx.strokeRect(mx-1,my-1,MINIMAP_SIZE+2,MINIMAP_SIZE+2);

  for(let gy=0;gy<ROWS;gy++){for(let gx=0;gx<COLS;gx++){
    const state=getFogCell(gx,gy);
    const px=mx+gx*MINIMAP_CELL,py=my+gy*MINIMAP_CELL;
    if(state===FOG_UNEXPLORED){ctx.fillStyle='#000';ctx.fillRect(px,py,MINIMAP_CELL,MINIMAP_CELL);}
    else if(state===FOG_EXPLORED){ctx.fillStyle='#1a1a2a';ctx.fillRect(px,py,MINIMAP_CELL,MINIMAP_CELL);}
    else{ctx.fillStyle='#1a2540';ctx.fillRect(px,py,MINIMAP_CELL,MINIMAP_CELL);}
  }}

  // Obstacles
  for(const obs of obstacles){
    if(!isCellExplored(obs.gx,obs.gy))continue;
    ctx.fillStyle='#2a3550';ctx.fillRect(mx+obs.gx*MINIMAP_CELL,my+obs.gy*MINIMAP_CELL,MINIMAP_CELL,MINIMAP_CELL);
  }

  // Buildings
  for(const b of buildings){
    if(!b.alive)continue;
    if(b.team==='enemy'&&!isBuildingVisibleToPlayer(b))continue;
    ctx.fillStyle=b.team==='player'?'#3b82f6':'#ef4444';
    const s=b.type==='hq'?MINIMAP_CELL*1.2:MINIMAP_CELL*0.8;
    ctx.fillRect(mx+b.gx*MINIMAP_CELL+(MINIMAP_CELL-s)/2,my+b.gy*MINIMAP_CELL+(MINIMAP_CELL-s)/2,s,s);
  }

  // Units
  for(const u of units){
    if(!u.alive)continue;
    if(u.team==='enemy'&&!isEntityVisibleToPlayer(u))continue;
    ctx.fillStyle=u.team==='player'?'#60a5fa':'#f87171';
    ctx.fillRect(mx+u.x/W*MINIMAP_SIZE-1,my+u.y/H*MINIMAP_SIZE-1,3,3);
  }

  // Viewport rect
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
  ctx.strokeRect(mx+cameraX/W*MINIMAP_SIZE,my+cameraY/H*MINIMAP_SIZE,VPW/W*MINIMAP_SIZE,VPH/H*MINIMAP_SIZE);
}

function handleMinimapClick(sx,sy){
  const mx=VPW-MINIMAP_SIZE-MINIMAP_MARGIN, my=VPH-MINIMAP_SIZE-MINIMAP_MARGIN;
  if(sx>=mx&&sx<=mx+MINIMAP_SIZE&&sy>=my&&sy<=my+MINIMAP_SIZE){
    const wx=(sx-mx)/MINIMAP_SIZE*W;
    const wy=(sy-my)/MINIMAP_SIZE*H;
    jumpCameraTo(wx,wy);
    return true;
  }
  return false;
}

// ===== INPUT =====
document.addEventListener('contextmenu',e=>{if(phase==='combat')e.preventDefault();});

canvas.addEventListener('mousedown',e=>{
  if(phase!=='combat')return;
  const{sx,sy}=canvasCoords(e);

  if(e.button===0){ // left
    if(handleMinimapClick(sx,sy))return;
    mouseDownPos={sx,sy};
    dragScreenStartX=sx;dragScreenStartY=sy;
    dragScreenCurX=sx;dragScreenCurY=sy;
    isDragging=false;
  }
});

canvas.addEventListener('mousemove',e=>{
  mouseX=e.clientX;mouseY=e.clientY;
  if(mouseDownPos&&e.buttons&1){
    const{sx,sy}=canvasCoords(e);
    dragScreenCurX=sx;dragScreenCurY=sy;
    if(Math.hypot(sx-dragScreenStartX,sy-dragScreenStartY)>DRAG_THRESHOLD)isDragging=true;
  }
});

canvas.addEventListener('mouseup',e=>{
  if(phase!=='combat')return;
  const{sx,sy}=canvasCoords(e);
  const w=screenToWorld(sx,sy);

  if(e.button===0){ // left release
    if(isDragging){
      // Box select
      const w1=screenToWorld(dragScreenStartX,dragScreenStartY);
      const w2=screenToWorld(sx,sy);
      const rx1=Math.min(w1.x,w2.x),ry1=Math.min(w1.y,w2.y);
      const rx2=Math.max(w1.x,w2.x),ry2=Math.max(w1.y,w2.y);
      selectedUnits=units.filter(u=>u.alive&&u.team==='player'&&u.x>=rx1&&u.x<=rx2&&u.y>=ry1&&u.y<=ry2);
    } else {
      // Single click - toggle friendly unit selection
      const clickedFriendly=units.find(u=>u.alive&&u.team==='player'&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
      if(clickedFriendly){
        const idx=selectedUnits.indexOf(clickedFriendly);
        if(idx>=0)selectedUnits.splice(idx,1); else selectedUnits.push(clickedFriendly);
      } else {
        // Click on enemy for glow (informational)
        const clickedEnemy=units.find(u=>u.alive&&u.team==='enemy'&&isEntityVisibleToPlayer(u)&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
        const clickedEBldg=buildings.find(b=>b.alive&&b.team==='enemy'&&(isBuildingVisibleToPlayer(b)||isBuildingExplored(b))&&dist(b,{x:w.x,y:w.y})<CELL*(b.type==='hq'?1.2:0.7));
        if(clickedEnemy) selectedTarget={entity:clickedEnemy,glowColor:'#ef4444'};
        else if(clickedEBldg) selectedTarget={entity:clickedEBldg,glowColor:clickedEBldg.type==='hq'?'#ff2222':'#f97316'};
        else {selectedUnits=[];selectedTarget=null;}
      }
    }
    mouseDownPos=null;isDragging=false;
  }

  if(e.button===2){ // right click
    const ring=document.createElement('div');ring.className='click-ring';
    const rect=canvas.getBoundingClientRect();
    ring.style.left=(e.clientX)+'px';ring.style.top=(e.clientY)+'px';

    // BUG-006: If no units selected, use all non-retreating player units (全军推进)
    const cmdUnits = selectedUnits.length > 0 ? selectedUnits : units.filter(u=>u.alive&&u.team==='player'&&!u.retreating);

    // Check right-click on visible enemy
    const clickedEnemy=units.find(u=>u.alive&&u.team==='enemy'&&isEntityVisibleToPlayer(u)&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
    const clickedEBldg=buildings.find(b=>b.alive&&b.team==='enemy'&&(isBuildingVisibleToPlayer(b)||isBuildingExplored(b))&&dist(b,{x:w.x,y:w.y})<CELL*(b.type==='hq'?1.2:0.7));

    if(clickedEnemy||clickedEBldg){
      const target=clickedEnemy||clickedEBldg;
      ring.classList.add('attack');
      cmdUnits.forEach(u=>{u.command={type:'focus',target};u.idle=false;u.retreating=false;});
      selectedTarget={entity:target,glowColor:target.team==='enemy'?'#ef4444':'#f97316'};
    } else {
      // Check right-click on friendly (retreat)
      const clickedFriendly=units.find(u=>u.alive&&u.team==='player'&&dist(u,{x:w.x,y:w.y})<CELL*0.6);
      if(clickedFriendly){
        ring.classList.add('retreat');
        clickedFriendly.retreating=true;
      } else {
        // Move command
        cmdUnits.forEach(u=>{u.command={type:'move',x:w.x,y:w.y};u.idle=false;u.target=null;});
        moveCursor={x:w.x,y:w.y,timer:3};
        // BUG-008: clear cursor shortly after command issued (0.5s)
        setTimeout(()=>{if(moveCursor&&moveCursor.x===w.x&&moveCursor.y===w.y)moveCursor=null;},500);
      }
    }
    $('click-feedback').appendChild(ring);setTimeout(()=>ring.remove(),600);
  }
});

document.addEventListener('keydown',e=>{keysDown.add(e.key.toLowerCase());});
document.addEventListener('keyup',e=>{keysDown.delete(e.key.toLowerCase());});

// ===== TACTICAL PRIORITY =====
$('btn-priority-back').addEventListener('click',()=>{
  tacticalPriority=tacticalPriority==='back'?null:'back';
  updatePriorityUI();
});
$('btn-priority-front').addEventListener('click',()=>{
  tacticalPriority=tacticalPriority==='front'?null:'front';
  updatePriorityUI();
});
function updatePriorityUI(){
  $('btn-priority-back').classList.toggle('active',tacticalPriority==='back');
  $('btn-priority-front').classList.toggle('active',tacticalPriority==='front');
}

// ===== EVENTS =====
$('btn-start').addEventListener('click',showFormationUI);
$('btn-back-deploy').addEventListener('click',()=>{showScreen('deploy-screen');phase='deploy';});
$('btn-confirm-formation').addEventListener('click',confirmFormation);
$('btn-replay').addEventListener('click',initDeploy);
$('btn-accept').addEventListener('click',acceptAdvice);
$('btn-reject').addEventListener('click',dismissAdvisor);

// ===== INIT =====
initDeploy();
</script>
